<div id="toast" class="toast"></div>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro">🌙</button>
<section id="home" class="view active"><header><h1>Routine</h1><p id="quote" class="quote"></p></header><main><div class="grid2"><div class="stat"><div class="label">🔥 Racha</div><div id="streak" class="value">0 días</div></div><div class="stat"><div class="label">📅 Hoy toca</div><div id="today" class="value">—</div></div></div><div class="section-title">Volumen semanal de pesas</div><div id="volumeChart" class="card chart"></div><div class="section-title">Progreso por ejercicio</div><div id="progress"></div><div class="section-title">Mejoras recientes</div><div id="prs"></div><div id="todayActions"></div><button id="reset" class="muted-btn">Reiniciar todos los datos</button></main></section>
<section id="days" class="view"><header><h1>Días</h1></header><main><div class="day-nav"><button id="prevDay" class="arrow">‹</button><div class="center"><div id="dayLabel" class="name"></div><span id="dayBadge" class="badge"></span></div><button id="nextDay" class="arrow">›</button></div><div id="dayContent"></div></main></section>
<section id="running" class="view"><header><h1>Running</h1><p class="quote">Media maratón · 18 semanas</p></header><main><div class="run-hero"><div class="label">Semana actual</div><div id="runWeekHero" class="value">Semana 1</div><div id="runHeroStats" class="sub" style="color:#fff1e8"></div></div><div class="date-config"><input id="planStart" class="field" type="date"><button id="saveStart" class="btn small run">Fijar inicio</button></div><p class="note" style="margin-top:7px">Elegí el lunes de la semana 1. El calendario se ajusta automáticamente.</p><div class="week-nav"><button id="prevWeek">‹</button><div id="weekTitle" class="week-title"></div><button id="nextWeek">›</button></div><div id="runSessions"></div></main></section>
<section id="account" class="view"><header><h1>Cuenta</h1><p class="quote">Respaldo y sincronización</p></header><main><div id="accountContent"></div></main></section>
<section id="session" class="view"><header><div class="session-head"><button id="back" class="back">←</button><div><h1 id="sessionTitle"></h1><div id="sessionDate" class="sub"></div></div></div></header><main id="exerciseList" style="padding-bottom:90px"></main><div class="savebar"><button id="saveStrength" class="btn" style="margin:0">Guardar sesión</button></div></section>
<div id="techModal" class="tech-modal" role="dialog" aria-modal="true" aria-labelledby="techTitle" onclick="if(event.target===this)closeTechnique()"><div class="tech-sheet"><div class="tech-head"><div><div class="label">Guía del ejercicio</div><h2 id="techTitle"></h2></div><button class="tech-close" onclick="closeTechnique()" aria-label="Cerrar">×</button></div><div id="techBody"></div></div></div>
<nav id="bottom" class="bottom"><button class="nav active" data-view="home"><span>⌂</span>Inicio</button><button class="nav" data-view="days"><span>▤</span>Días</button><button class="nav" data-view="running"><span>◉</span>Running</button><button class="nav" data-view="account"><span>♙</span>Cuenta</button></nav>

async function ensureFreshAuth(){if(!loggedIn())throw new Error("Iniciá sesión");const expires=(AUTH.expires_at||0)*1000;if(expires&&Date.now()<expires-60000)return AUTH;const data=await cloudRequest("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:AUTH.refresh_token})},false);setAuth(data);return AUTH}

function mergeByKey(first,second,keyFn,secondWins){const map=new Map();first.forEach(item=>map.set(keyFn(item),item));second.forEach(item=>{const key=keyFn(item);if(secondWins||!map.has(key))map.set(key,item)});return [...map.values()]}
function mergeData(local,remote){const localNewer=new Date(local.updatedAt||0)>=new Date(remote.updatedAt||0),newer=localNewer?local:remote,older=localNewer?remote:local;return normalizeData({...older,...newer,sessions:mergeByKey(older.sessions||[],newer.sessions||[],x=>x.date+"|"+x.workoutType,true),runSessions:mergeByKey(older.runSessions||[],newer.runSessions||[],x=>x.date,true),updatedAt:new Date().toISOString(),cloudOwnerId:loggedIn()?AUTH.user.id:(newer.cloudOwnerId||older.cloudOwnerId||null)})}

cState.type}"></div></div><button class="btn" onclick="syncCloud(true)">Sincronizar ahora</button><button class="muted-btn" onclick="signOut()">Cerrar sesión</button></div>${backupHtml()}`;setSyncState(syncState.type,syncState.text)}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routine - Pesas y Running</title>

<style>
:root {
  --bg:#faf9f6;
  --card:#fff;
  --border:#e8e6df;
  --text:#1e1e23;
  --t2:#6b6a66;
  --t3:#98968e;
  --accent:#3a36b0;
  --light:#eeedfe;
  --ok:#0f6e56;
  --okbg:#e1f5ee;
  --run:#c45119;
  --runbg:#fff0e8;
  --radius:14px;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding-bottom:88px;
}

header {
  padding:20px 20px 12px;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:10;
}

h1 {
  font-size:20px;
}

main {
  padding:0 20px;
}

.quote {
  font-style:italic;
  font-size:14px;
  color:var(--t2);
  margin-top:6px;
  line-height:1.45;
}

.grid2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px 0;
}

.card,
.stat,
.exercise,
.run-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
}

.stat {
  padding:14px 16px;
}

.label {
  font-size:12px;
  color:var(--t2);
  margin-bottom:4px;
}

.value {
  font-size:21px;
  font-weight:750;
}

.section-title {
  font-size:13px;
  color:var(--t2);
  margin:20px 0 8px;
  font-weight:700;
  text-transform:uppercase;
}

.chart {
  height:170px;
  padding:14px;
}

.bars {
  height:100%;
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding-top:8px;
}

.barcol {
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
}

.bar {
  width:100%;
  max-width:30px;
  background:#7f77dd;
  border-radius:5px 5px 2px 2px;
  min-height:3px;
}

.barval {
  font-size:9px;
  color:var(--t2);
}

.barlabel {
  font-size:10px;
  color:var(--t3);
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 14px;
  margin-bottom:8px;
}

.name {
  font-size:14px;
  font-weight:700;
}

.sub {
  font-size:12px;
  color:var(--t2);
  margin-top:3px;
}

.ok {
  color:var(--ok);
}

button,
input,
textarea {
  font:inherit;
}

.btn {
  width:100%;
  padding:14px;
  border:0;
  border-radius:var(--radius);
  font-weight:750;
  background:var(--accent);
  color:white;
  margin:16px 0 0;
  cursor:pointer;
}

.btn:disabled {
  opacity:.45;
  cursor:default;
}

.btn.run {
  background:var(--run);
}

.btn.small {
  width:auto;
  padding:8px 12px;
  margin:0;
  font-size:12px;
}

.muted-btn {
  display:block;
  width:100%;
  border:0;
  background:none;
  color:var(--t3);
  padding:14px;
  cursor:pointer;
}

.empty {
  text-align:center;
  color:var(--t3);
  font-size:13px;
  padding:22px 8px;
}

.bottom {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  max-width:480px;
  width:100%;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex;
  z-index:30;
}

.nav {
  flex:1;
  border:0;
  background:none;
  padding:9px 0 7px;
  color:var(--t3);
  font-size:10px;
  cursor:pointer;
}

.nav span {
  display:block;
  font-size:19px;
}

.nav.active {
  color:var(--accent);
  font-weight:750;
}

.view {
  display:none;
}

.view.active {
  display:block;
}

.day-nav {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:5px 0 17px;
}

.arrow {
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:white;
  font-size:20px;
  cursor:pointer;
}

.center {
  text-align:center;
}

.badge {
  display:inline-block;
  background:var(--light);
  color:var(--accent);
  border-radius:20px;
  padding:3px 9px;
  font-size:11px;
  font-weight:750;
  margin-top:4px;
}

.rest {
  padding:40px 20px;
  text-align:center;
  color:var(--t2);
}

.exercise {
  padding:14px 16px;
  margin-bottom:12px;
}

.ex-head {
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.target {
  font-size:12px;
  color:var(--t2);
  margin:3px 0 10px;
}

.set {
  display:grid;
  grid-template-columns:25px 1fr 1fr;
  gap:8px;
  margin-bottom:8px;
  align-items:center;
}

.set input,
.field {
  width:100%;
  padding:9px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--bg);
}

.skip {
  font-size:11px;
  color:var(--t2);
}

.exercise.skipped {
  opacity:.5;
}

.savebar {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  max-width:480px;
  width:100%;
  padding:12px 20px 18px;
  background:var(--bg);
  border-top:1px solid var(--border);
  z-index:40;
}

.toast {
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:#1e1e23;
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  opacity:0;
  z-index:80;
  transition:.2s;
  pointer-events:none;
}

.toast.show {
  opacity:1;
}

.run-hero {
  background:linear-gradient(135deg,#b94716,#e47a31);
  color:#fff;
  padding:18px;
  border-radius:18px;
  margin:4px 0 14px;
}

.run-hero .label {
  color:#ffe4d3;
}

.run-card {
  padding:14px;
  margin-bottom:10px;
  border-left:4px solid var(--run);
}

.run-top {
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.run-title {
  font-weight:750;
  font-size:15px;
}

.run-detail {
  font-size:13px;
  color:var(--t2);
  line-height:1.45;
  margin-top:6px;
}

.done {
  background:var(--okbg);
  color:var(--ok);
  font-size:11px;
  font-weight:750;
  padding:4px 8px;
  border-radius:20px;
  white-space:nowrap;
}

.week-nav {
  display:grid;
  grid-template-columns:42px 1fr 42px;
  align-items:center;
  gap:8px;
  margin:12px 0;
}

.week-nav button {
  height:38px;
  border-radius:10px;
  border:1px solid var(--border);
  background:white;
  cursor:pointer;
}

.week-title {
  text-align:center;
  font-weight:750;
}

.date-config {
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.date-config .btn {
  margin:0;
}

.run-form {
  padding:14px;
  margin-top:10px;
  background:var(--runbg);
  border-radius:12px;
}

.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.form-grid label,
.full-label {
  display:block;
  font-size:11px;
  color:var(--t2);
}

textarea.field {
  min-height:72px;
  resize:vertical;
}

.back {
  border:0;
  background:none;
  font-size:22px;
  padding-right:10px;
  cursor:pointer;
}

.session-head {
  display:flex;
  align-items:center;
}

.note {
  font-size:12px;
  color:var(--t2);
  line-height:1.45;
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<section id="home" class="view active">
  <header>
    <h1>Routine</h1>
    <p id="quote" class="quote"></p>
  </header>

  <main>
    <div class="grid2">
      <div class="stat">
        <div class="label">🔥 Racha</div>
        <div id="streak" class="value">0 días</div>
      </div>

      <div class="stat">
        <div class="label">📅 Hoy toca</div>
        <div id="today" class="value">—</div>
      </div>
    </div>

    <div class="section-title">Volumen semanal de pesas</div>
    <div id="volumeChart" class="card chart"></div>

    <div class="section-title">Progreso por ejercicio</div>
    <div id="progress"></div>

    <div class="section-title">Mejoras recientes</div>
    <div id="prs"></div>

    <button id="todayAction" class="btn">Empezar sesión</button>
    <button id="reset" class="muted-btn">Reiniciar todos los datos</button>
  </main>
</section>

<section id="days" class="view">
  <header>
    <h1>Días</h1>
  </header>

  <main>
    <div class="day-nav">
      <button id="prevDay" class="arrow">‹</button>

      <div class="center">
        <div id="dayLabel" class="name"></div>
        <span id="dayBadge" class="badge"></span>
      </div>

      <button id="nextDay" class="arrow">›</button>
    </div>

    <div id="dayContent"></div>
  </main>
</section>

<section id="running" class="view">
  <header>
    <h1>Running</h1>
    <p class="quote">Media maratón · 18 semanas</p>
  </header>

  <main>
    <div class="run-hero">
      <div class="label">Semana actual</div>
      <div id="runWeekHero" class="value">Semana 1</div>
      <div id="runHeroStats" class="sub" style="color:#fff1e8"></div>
    </div>

    <div class="date-config">
      <input id="planStart" class="field" type="date">
      <button id="saveStart" class="btn small run">Fijar inicio</button>
    </div>

    <p class="note" style="margin-top:7px">
      Elegí el lunes de la semana 1. El calendario se ajusta automáticamente.
    </p>

    <div class="week-nav">
      <button id="prevWeek">‹</button>
      <div id="weekTitle" class="week-title"></div>
      <button id="nextWeek">›</button>
    </div>

    <div id="runSessions"></div>
  </main>
</section>

<section id="session" class="view">
  <header>
    <div class="session-head">
      <button id="back" class="back">←</button>

      <div>
        <h1 id="sessionTitle"></h1>
        <div id="sessionDate" class="sub"></div>
      </div>
    </div>
  </header>

  <main id="exerciseList" style="padding-bottom:90px"></main>

  <div class="savebar">
    <button id="saveStrength" class="btn" style="margin:0">
      Guardar sesión
    </button>
  </div>
</section>

<nav id="bottom" class="bottom">
  <button class="nav active" data-view="home">
    <span>⌂</span>
    Inicio
  </button>

  <button class="nav" data-view="days">
    <span>▤</span>
    Días
  </button>

  <button class="nav" data-view="running">
    <span>◉</span>
    Running
  </button>
</nav>

<script>
const WORKOUTS = {
  A: [
    {name:"Bench press / Floor press / Weighted pushups",sets:3,reps:"8-15"},
    {name:"Pullover",sets:3,reps:"8-15"},
    {name:"Overhead press",sets:3,reps:"8-15"},
    {name:"Biceps curl",sets:3,reps:"12-20"},
    {name:"Skullcrusher / Any overhead extension",sets:3,reps:"15-20"},
    {name:"Rear delt fly",sets:3,reps:"15-20"},
    {name:"Lateral raise",sets:3,reps:"15-20"},
    {name:"Front squat",sets:3,reps:"8-15"},
    {name:"Romanian deadlift",sets:3,reps:"8-15"},
    {name:"Calf raise",sets:3,reps:"15-25"}
  ],

  B: [
    {name:"Overhead press",sets:3,reps:"8-15"},
    {name:"Dumbbell row",sets:3,reps:"8-15"},
    {name:"Incline bench press / Decline pushup",sets:3,reps:"8-15"},
    {name:"Hammer curl",sets:3,reps:"12-20"},
    {name:"Triceps kickback",sets:3,reps:"15-20"},
    {name:"Rear delt fly",sets:3,reps:"15-20"},
    {name:"Lateral raise",sets:3,reps:"15-20"}
  ],

  B2: [
    {name:"Overhead press",sets:3,reps:"8-15"},
    {name:"Dumbbell row",sets:3,reps:"8-15"},
    {name:"Incline bench press / Decline pushup",sets:3,reps:"8-15"},
    {name:"Hammer curl",sets:3,reps:"12-20"},
    {name:"Triceps kickback",sets:3,reps:"15-20"},
    {name:"Rear delt fly",sets:3,reps:"15-20"},
    {name:"Lateral raise",sets:3,reps:"15-20"},
    {name:"Lunges",sets:2,reps:"8-12 por pierna"},
    {name:"Front squat",sets:2,reps:"8-12"},
    {name:"Calf raise",sets:3,reps:"15-25"}
  ]
};

const STRENGTH = {
  1:"A",
  2:"B",
  4:"B2"
};

const RUN_DAY = {
  3:"quality",
  6:"long",
  0:"easy"
};

const DISPLAY = {
  A:"A",
  B:"B torso",
  B2:"B completo"
};

const RUN_PLAN = [
  ["Fácil 4 km","Fondo 6 km","Fácil 4 km"],
  ["Fácil 5 km","Fondo 7 km","Fácil 4 km"],
  ["Fácil 5 km + 4 progresiones","Fondo 8 km","Fácil 4 km"],
  ["Fácil 5 km","Fondo 9 km","Fácil 5 km"],

  ["1,5 km cal. + 3 km RMM + 1,5 km enf.","Fondo 10 km","Fácil 5 km"],
  ["1,5 km cal. + 6×400 m rápido, 200 m trote + 1,5 km enf.","Fondo 11 km","Fácil 5 km"],
  ["1,5 km cal. + 6×600 m rápido, 200 m trote + 1,5 km enf.","Fondo 12 km","Fácil 6 km"],
  ["Fácil 6 km + 4 progresiones","Fondo 10 km · descarga","Fácil 5 km"],

  ["1,5 km cal. + 4×1 km rápido, 400 m trote + 1,5 km enf.","Fondo 13 km","Fácil 6 km"],
  ["1,5 km cal. + 6 km RMM + 1,5 km enf.","Fondo 14 km","Fácil 6 km"],
  ["1,5 km cal. + 3×2 km RMM, 500 m trote + 1,5 km enf.","Fondo 15 km","Fácil 7 km"],
  ["Fácil 6 km","Fondo 12 km · descarga","Fácil 5 km"],

  ["1,5 km cal. + 3×2 km RMM-5 s/km, 500 m trote + 1,5 km enf.","Fondo 16 km","Fácil 7 km"],
  ["1,5 km cal. + 8 km RMM + 1,5 km enf.","Fondo 17 km","Fácil 7 km"],
  ["1,5 km cal. + 2×3 km RMM-5 s/km, 800 m trote + 1,5 km enf.","Fondo 18 km","Fácil 6 km"],
  ["1,5 km cal. + 8 km RMM + 1,5 km enf.","Fondo 19 km","Fácil 5 km"],

  ["1,5 km cal. + 5 km RMM + 1,5 km enf.","Fondo 14 km · descarga","Fácil 4 km"],
  ["Fácil 5 km + 4 progresiones","Activación 3 km muy fácil","CARRERA 21,1 km"]
];

const STORE = "workoutTrackerData";
const SINGLE = new Set(["Pullover","Dumbbell row"]);

const DAYS = [
  "Domingo",
  "Lunes",
  "Martes",
  "Miércoles",
  "Jueves",
  "Viernes",
  "Sábado"
];

const MONTHS = [
  "ene","feb","mar","abr","may","jun",
  "jul","ago","sep","oct","nov","dic"
];

const QUOTES = [
  "No hace falta motivación, hace falta empezar.",
  "Hoy no tiene que ser perfecto, tiene que ser hecho.",
  "La constancia le gana al talento cuando el talento no entrena.",
  "Cada sesión suma, aunque no todas se sientan increíbles."
];

function localDate(date = new Date()) {
  return date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2,"0") + "-" +
    String(date.getDate()).padStart(2,"0");
}

function dateObj(dateString) {
  return new Date(dateString + "T00:00:00");
}

function shift(dateString, days) {
  const date = dateObj(dateString);
  date.setDate(date.getDate() + days);
  return localDate(date);
}

function mondayOf(dateString) {
  const date = dateObj(dateString);
  const day = date.getDay();

  date.setDate(
    date.getDate() - (day === 0 ? 6 : day - 1)
  );

  return localDate(date);
}

function fmt(dateString) {
  const date = dateObj(dateString);

  return DAYS[date.getDay()] + " " +
    date.getDate() + " " +
    MONTHS[date.getMonth()];
}

let memoryStore = null;

function storageGet() {
  try {
    return localStorage.getItem(STORE);
  } catch(error) {
    return memoryStore;
  }
}

function storageSet(value) {
  try {
    localStorage.setItem(STORE,value);
  } catch(error) {
    memoryStore = value;
  }
}

function storageRemove() {
  try {
    localStorage.removeItem(STORE);
  } catch(error) {
    memoryStore = null;
  }
}

function load() {
  let data;

  try {
    data = JSON.parse(storageGet());
  } catch(error) {}

  data = data || {
    startDate:localDate(),
    sessions:[]
  };

  data.sessions = Array.isArray(data.sessions)
    ? data.sessions
    : [];

  data.runSessions = Array.isArray(data.runSessions)
    ? data.runSessions
    : [];

  data.runPlanStart =
    data.runPlanStart || mondayOf(localDate());

  return data;
}

let DATA = load();

function save() {
  storageSet(JSON.stringify(DATA));
}

function toast(message) {
  const element = document.querySelector("#toast");

  element.textContent = message;
  element.classList.add("show");

  setTimeout(() => {
    element.classList.remove("show");
  },1700);
}

function planInfo(dateString) {
  const difference = Math.floor(
    (dateObj(dateString) - dateObj(DATA.runPlanStart)) / 86400000
  );

  const week = Math.floor(difference / 7) + 1;
  const day = dateObj(dateString).getDay();

  if(week < 1 || week > 18 || !RUN_DAY[day]) {
    return null;
  }

  const index = day === 3 ? 0 : day === 6 ? 1 : 2;

  return {
    week,
    kind:RUN_DAY[day],
    detail:RUN_PLAN[week - 1][index],
    date:dateString
  };
}

function activity(dateString) {
  const day = dateObj(dateString).getDay();

  if(STRENGTH[day]) {
    return {
      type:"strength",
      key:STRENGTH[day]
    };
  }

  const run = planInfo(dateString);

  if(run) {
    return {
      type:"run",
      ...run
    };
  }

  return {
    type:"rest"
  };
}

function strengthSession(dateString,type) {
  return DATA.sessions.find(session =>
    session.date === dateString &&
    session.workoutType === type
  );
}

function runSession(dateString) {
  return DATA.runSessions.find(session =>
    session.date === dateString
  );
}

function show(viewId) {
  document.querySelectorAll(".view").forEach(view => {
    view.classList.toggle("active",view.id === viewId);
  });

  document.querySelector("#bottom").style.display =
    viewId === "session" ? "none" : "flex";

  document.querySelectorAll(".nav").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.view === viewId
    );
  });
}

function streak() {
  let total = 0;
  const cursor = new Date();

  for(let index = 0; index < 400; index++) {
    const dateString = localDate(cursor);
    const currentActivity = activity(dateString);

    const completed =
      currentActivity.type === "rest" ||
      (
        currentActivity.type === "strength" &&
        strengthSession(dateString,currentActivity.key)
      ) ||
      (
        currentActivity.type === "run" &&
        runSession(dateString)
      );

    if(dateString === localDate() && !completed) {
      cursor.setDate(cursor.getDate() - 1);
      continue;
    }

    if(!completed) {
      break;
    }

    total++;
    cursor.setDate(cursor.getDate() - 1);
  }

  return total;
}

function renderHome() {
  const todayString = localDate();
  const currentActivity = activity(todayString);

  const completed =
    currentActivity.type === "strength"
      ? Boolean(strengthSession(todayString,currentActivity.key))
      : currentActivity.type === "run"
        ? Boolean(runSession(todayString))
        : false;

  document.querySelector("#quote").textContent =
    QUOTES[new Date().getDate() % QUOTES.length];

  document.querySelector("#streak").textContent =
    streak() + " días";

  document.querySelector("#today").textContent =
    currentActivity.type === "strength"
      ? "Workout " + DISPLAY[currentActivity.key]
      : currentActivity.type === "run"
        ? (
          currentActivity.kind === "long"
            ? "Fondo"
            : currentActivity.kind === "easy"
              ? "Run fácil"
              : "Calidad"
        )
        : "Descanso";

  const button = document.querySelector("#todayAction");

  button.textContent =
    completed
      ? "Editar sesión de hoy"
      : currentActivity.type === "rest"
        ? "Hoy: descanso"
        : "Empezar sesión de hoy";

  button.disabled = currentActivity.type === "rest";

  button.onclick = () => {
    if(currentActivity.type === "strength") {
      openStrength(
        currentActivity.key,
        todayString,
        "home"
      );
    }

    if(currentActivity.type === "run") {
      openRunForm(todayString);
    }
  };

  renderVolume();
  renderProgress();
  renderPRs();
}

function renderVolume() {
  const values = [];

  for(let index = 5; index >= 0; index--) {
    const end = shift(localDate(),-index * 7);
    const start = shift(end,-6);

    let volume = 0;

    DATA.sessions.forEach(session => {
      if(session.date < start || session.date > end) {
        return;
      }

      (session.exercises || []).forEach(exercise => {
        if(exercise.skipped) {
          return;
        }

        const multiplier =
          SINGLE.has(exercise.name) ? 1 : 2;

        (exercise.sets || []).forEach(set => {
          volume +=
            (Number(set.weight) || 0) *
            (Number(set.reps) || 0) *
            multiplier;
        });
      });
    });

    values.push(Math.round(volume));
  }

  const maximum = Math.max(1,...values);
  const labels = ["S-5","S-4","S-3","S-2","S-1","Esta"];

  document.querySelector("#volumeChart").innerHTML =
    `<div class="bars">${
      values.map((value,index) => `
        <div class="barcol">
          <div class="barval">
            ${value ? Math.round(value / 100) / 10 + "k" : "0"}
          </div>

          <div
            class="bar"
            style="height:${Math.max(3,value / maximum * 105)}px"
          ></div>

          <div class="barlabel">${labels[index]}</div>
        </div>
      `).join("")
    }</div>`;
}

function histories() {
  const map = {};

  DATA.sessions
    .slice()
    .sort((a,b) => a.date.localeCompare(b.date))
    .forEach(session => {
      (session.exercises || []).forEach(exercise => {
        if(exercise.skipped) {
          return;
        }

        const multiplier =
          SINGLE.has(exercise.name) ? 1 : 2;

        const weights = (exercise.sets || []).map(set =>
          (Number(set.weight) || 0) * multiplier
        );

        const maximum = Math.max(0,...weights);

        if(maximum) {
          if(!map[exercise.name]) {
            map[exercise.name] = [];
          }

          map[exercise.name].push({
            date:session.date,
            max:maximum
          });
        }
      });
    });

  return map;
}

function renderProgress() {
  const container = document.querySelector("#progress");
  const history = histories();
  const items = Object.entries(history).slice(0,5);

  if(!items.length) {
    container.innerHTML =
      '<div class="empty">Registrá una sesión para ver tu progreso.</div>';
    return;
  }

  container.innerHTML = items.map(([name,records]) => {
    const first = records[0];
    const last = records[records.length - 1];
    const difference = last.max - first.max;

    return `
      <div class="card row">
        <div>
          <div class="name">${name.split("/")[0]}</div>

          <div class="sub ok">
            ${
              records.length > 1
                ? (difference >= 0 ? "+" : "") +
                  difference + " kg"
                : "Primer registro"
            }
          </div>
        </div>

        <b>${last.max} kg</b>
      </div>
    `;
  }).join("");
}

function renderPRs() {
  const container = document.querySelector("#prs");
  const history = histories();
  const records = [];

  Object.entries(history).forEach(([name,values]) => {
    if(values.length < 2) {
      return;
    }

    const previous = values[values.length - 2];
    const current = values[values.length - 1];

    if(current.max > previous.max) {
      records.push(
        `${name.split("/")[0]}: ${previous.max} → ${current.max} kg`
      );
    }
  });

  if(!records.length) {
    container.innerHTML =
      '<div class="empty">Las nuevas marcas van a aparecer acá.</div>';
    return;
  }

  container.innerHTML = records
    .slice(0,4)
    .map(record => `
      <div class="card row">
        <span class="ok">↑ ${record}</span>
      </div>
    `)
    .join("");
}

let dayDate = localDate();

function renderDay() {
  const currentActivity = activity(dayDate);
  const container = document.querySelector("#dayContent");

  document.querySelector("#dayLabel").textContent =
    fmt(dayDate) +
    (dayDate === localDate() ? " · Hoy" : "");

  document.querySelector("#dayBadge").textContent =
    DAYS[dateObj(dayDate).getDay()];

  if(currentActivity.type === "rest") {
    container.innerHTML =
      '<div class="card rest">💤<br><br>Día de descanso</div>';
    return;
  }

  if(currentActivity.type === "run") {
    const log = runSession(dayDate);

    container.innerHTML = `
      <div class="run-card">
        <div class="run-top">
          <div>
            <div class="run-title">
              Semana ${currentActivity.week} ·
              ${
                currentActivity.kind === "quality"
                  ? "Calidad"
                  : currentActivity.kind === "long"
                    ? "Fondo"
                    : "Fácil"
              }
            </div>

            <div class="run-detail">
              ${currentActivity.detail}
            </div>
          </div>

          ${log ? '<span class="done">Completado</span>' : ""}
        </div>

        ${
          log
            ? `
              <div class="sub ok" style="margin-top:8px">
                ${log.km || 0} km ·
                ${log.time || "sin tiempo"} ·
                RPE ${log.rpe || "—"}
              </div>
            `
            : ""
        }
      </div>

      <button
        class="btn run"
        onclick="openRunForm('${dayDate}')"
      >
        ${log ? "Editar" : "Registrar"} corrida
      </button>
    `;

    return;
  }

  const session = strengthSession(
    dayDate,
    currentActivity.key
  );

  const exerciseRows = WORKOUTS[currentActivity.key]
    .map(exercise => {
      const loggedExercise =
        session &&
        session.exercises.find(item =>
          item.name === exercise.name
        );

      let detail =
        `Objetivo: ${exercise.sets} × ${exercise.reps}`;

      if(loggedExercise) {
        detail = loggedExercise.skipped
          ? "No hecho"
          : loggedExercise.sets
              .map(set =>
                `${set.weight || "-"}kg×${set.reps || "-"}`
              )
              .join(", ");
      }

      return `
        <div class="card row">
          <div>
            <div class="name">${exercise.name}</div>

            <div class="sub ${loggedExercise && !loggedExercise.skipped ? "ok" : ""}">
              ${detail}
            </div>
          </div>
        </div>
      `;
    })
    .join("");

  container.innerHTML = `
    <div class="name" style="margin-bottom:10px">
      Workout ${DISPLAY[currentActivity.key]}
    </div>

    ${exerciseRows}

    <button
      class="btn"
      onclick="openStrength(
        '${currentActivity.key}',
        '${dayDate}',
        'days'
      )"
    >
      ${session ? "Editar" : "Registrar"} sesión
    </button>
  `;
}

function shiftDay(days) {
  dayDate = shift(dayDate,days);
  renderDay();
}

let currentSession = {};

function openStrength(type,dateString,returnView) {
  currentSession = {
    type,
    date:dateString,
    returnView
  };

  show("session");

  document.querySelector("#sessionTitle").textContent =
    "Workout " + DISPLAY[type];

  document.querySelector("#sessionDate").textContent =
    fmt(dateString);

  const existingSession =
    strengthSession(dateString,type);

  const container =
    document.querySelector("#exerciseList");

  container.innerHTML = WORKOUTS[type]
    .map((exercise,index) => {
      const previousExercise = DATA.sessions
        .filter(session => session.date < dateString)
        .sort((a,b) => b.date.localeCompare(a.date))
        .map(session =>
          (session.exercises || []).find(item =>
            item.name === exercise.name &&
            !item.skipped
          )
        )
        .find(Boolean);

      const currentExercise =
        existingSession &&
        existingSession.exercises.find(item =>
          item.name === exercise.name
        );

      const skipped =
        currentExercise && currentExercise.skipped;

      const sets = Array
        .from({length:exercise.sets},(_,setIndex) => {
          const previousSet =
            previousExercise &&
            previousExercise.sets[setIndex];

          const currentSet =
            currentExercise &&
            currentExercise.sets[setIndex];

          return `
            <div class="set">
              <span>${setIndex + 1}</span>

              <input
                type="number"
                step="0.5"
                class="w"
                placeholder="${previousSet?.weight || "kg"}"
                value="${currentSet?.weight || ""}"
                ${skipped ? "disabled" : ""}
              >

              <input
                type="number"
                class="r"
                placeholder="${previousSet?.reps || "reps"}"
                value="${currentSet?.reps || ""}"
                ${skipped ? "disabled" : ""}
              >
            </div>
          `;
        })
        .join("");

      return `
        <div
          class="exercise ${skipped ? "skipped" : ""}"
          data-i="${index}"
        >
          <div class="ex-head">
            <b>${index + 1}. ${exercise.name}</b>

            <label class="skip">
              <input
                type="checkbox"
                class="skipbox"
                ${skipped ? "checked" : ""}
              >
              No hecho
            </label>
          </div>

          <div class="target">
            ${exercise.sets} sets ·
            ${exercise.reps} reps
            ${SINGLE.has(exercise.name) ? "" : " · peso por mancuerna"}
          </div>

          ${sets}
        </div>
      `;
    })
    .join("");

  container.querySelectorAll(".skipbox").forEach(checkbox => {
    checkbox.addEventListener("change",() => {
      const card = checkbox.closest(".exercise");

      card.classList.toggle(
        "skipped",
        checkbox.checked
      );

      card
        .querySelectorAll("input.w,input.r")
        .forEach(input => {
          input.disabled = checkbox.checked;
        });
    });
  });
}

function saveStrength() {
  const exercises =
    WORKOUTS[currentSession.type].map((exercise,index) => {
      const card = document.querySelector(
        `.exercise[data-i="${index}"]`
      );

      const skipped =
        card.querySelector(".skipbox").checked;

      const sets = [...card.querySelectorAll(".set")]
        .map(row => ({
          weight:skipped
            ? ""
            : row.querySelector(".w").value,

          reps:skipped
            ? ""
            : row.querySelector(".r").value
        }));

      return {
        name:exercise.name,
        skipped,
        sets
      };
    });

  const hasData = exercises.some(exercise =>
    exercise.skipped ||
    exercise.sets.some(set =>
      set.weight || set.reps
    )
  );

  if(!hasData) {
    toast("Cargá al menos un set");
    return;
  }

  DATA.sessions = DATA.sessions.filter(session =>
    !(
      session.date === currentSession.date &&
      session.workoutType === currentSession.type
    )
  );

  DATA.sessions.push({
    date:currentSession.date,
    workoutType:currentSession.type,
    exercises
  });

  save();
  toast("Sesión guardada");

  setTimeout(() => {
    show(currentSession.returnView);

    if(currentSession.returnView === "days") {
      renderDay();
    } else {
      renderHome();
    }
  },500);
}

let selectedWeek = 1;

function currentWeek() {
  const difference =
    dateObj(localDate()) -
    dateObj(DATA.runPlanStart);

  return Math.max(
    1,
    Math.min(
      18,
      Math.floor(difference / 604800000) + 1
    )
  );
}

function weekDate(week,offset) {
  return shift(
    DATA.runPlanStart,
    (week - 1) * 7 + offset
  );
}

function runStats() {
  const completed = DATA.runSessions.length;

  const total = DATA.runSessions.reduce(
    (sum,session) =>
      sum + (Number(session.km) || 0),
    0
  );

  const longest = Math.max(
    0,
    ...DATA.runSessions.map(session =>
      Number(session.km) || 0
    )
  );

  return {
    completed,
    total,
    longest
  };
}

function renderRunning() {
  document.querySelector("#planStart").value =
    DATA.runPlanStart;

  const current = currentWeek();
  const stats = runStats();

  document.querySelector("#runWeekHero").textContent =
    "Semana " + current;

  document.querySelector("#runHeroStats").textContent =
    `${stats.completed} sesiones · ` +
    `${stats.total.toFixed(1)} km · ` +
    `fondo máximo ${stats.longest} km`;

  document.querySelector("#weekTitle").textContent =
    `Semana ${selectedWeek} de 18`;

  const sessions = [
    {
      offset:2,
      title:"Calidad",
      detail:RUN_PLAN[selectedWeek - 1][0]
    },
    {
      offset:5,
      title:"Fondo",
      detail:RUN_PLAN[selectedWeek - 1][1]
    },
    {
      offset:6,
      title:selectedWeek === 18
        ? "Carrera"
        : "Fácil",
      detail:RUN_PLAN[selectedWeek - 1][2]
    }
  ];

  document.querySelector("#runSessions").innerHTML =
    sessions.map(session => {
      const dateString =
        weekDate(selectedWeek,session.offset);

      const log =
        runSession(dateString);

      return `
        <div class="run-card">
          <div class="run-top">
            <div>
              <div class="run-title">
                ${fmt(dateString)} · ${session.title}
              </div>

              <div class="run-detail">
                ${session.detail}
              </div>
            </div>

            ${
              log
                ? '<span class="done">Completado</span>'
                : ""
            }
          </div>

          ${
            log
              ? `
                <div class="sub ok" style="margin-top:8px">
                  ${log.km || 0} km ·
                  ${log.time || "sin tiempo"} ·
                  RPE ${log.rpe || "—"}
                </div>
              `
              : ""
          }

          <button
            class="btn small run"
            style="margin-top:10px"
            onclick="openRunForm('${dateString}')"
          >
            ${log ? "Editar" : "Registrar"}
          </button>

          <div id="form-${dateString}"></div>
        </div>
      `;
    })
    .join("");
}

function openRunForm(dateString) {
  show("running");

  const info = planInfo(dateString);

  selectedWeek =
    info ? info.week : currentWeek();

  renderRunning();

  const host = document.querySelector(
    `#form-${dateString}`
  );

  if(!host) {
    return;
  }

  const existing =
    runSession(dateString) || {};

  host.innerHTML = `
    <div class="run-form">
      <div class="form-grid">
        <label>
          Distancia real (km)

          <input
            id="runKm"
            class="field"
            type="number"
            step="0.01"
            value="${existing.km || ""}"
          >
        </label>

        <label>
          Tiempo

          <input
            id="runTime"
            class="field"
            placeholder="01:10:00"
            value="${existing.time || ""}"
          >
        </label>

        <label>
          RPE (1-10)

          <input
            id="runRpe"
            class="field"
            type="number"
            min="1"
            max="10"
            value="${existing.rpe || ""}"
          >
        </label>

        <label>
          Ritmo medio

          <input
            id="runPace"
            class="field"
            placeholder="7:00/km"
            value="${existing.pace || ""}"
          >
        </label>
      </div>

      <label class="full-label">
        Notas

        <textarea
          id="runNotes"
          class="field"
        >${existing.notes || ""}</textarea>
      </label>

      <button
        class="btn run"
        onclick="saveRun('${dateString}')"
      >
        Guardar corrida
      </button>

      ${
        existing.date
          ? `
            <button
              class="muted-btn"
              onclick="deleteRun('${dateString}')"
            >
              Eliminar registro
            </button>
          `
          : ""
      }
    </div>
  `;

  host.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
}

function saveRun(dateString) {
  const item = {
    date:dateString,
    km:document.querySelector("#runKm").value,
    time:document.querySelector("#runTime").value,
    rpe:document.querySelector("#runRpe").value,
    pace:document.querySelector("#runPace").value,
    notes:document.querySelector("#runNotes").value
  };

  if(!item.km && !item.time) {
    toast("Ingresá distancia o tiempo");
    return;
  }

  DATA.runSessions = DATA.runSessions.filter(session =>
    session.date !== dateString
  );

  DATA.runSessions.push(item);

  save();
  toast("Corrida guardada");
  renderRunning();
}

function deleteRun(dateString) {
  if(!confirm("¿Eliminar esta corrida?")) {
    return;
  }

  DATA.runSessions = DATA.runSessions.filter(session =>
    session.date !== dateString
  );

  save();
  renderRunning();
}

document.querySelectorAll(".nav").forEach(button => {
  button.addEventListener("click",() => {
    const view = button.dataset.view;

    show(view);

    if(view === "home") {
      renderHome();
    }

    if(view === "days") {
      dayDate = localDate();
      renderDay();
    }

    if(view === "running") {
      selectedWeek = currentWeek();
      renderRunning();
    }
  });
});

document.querySelector("#prevDay").addEventListener(
  "click",
  () => shiftDay(-1)
);

document.querySelector("#nextDay").addEventListener(
  "click",
  () => shiftDay(1)
);

document.querySelector("#back").addEventListener(
  "click",
  () => {
    show(currentSession.returnView);

    if(currentSession.returnView === "days") {
      renderDay();
    } else {
      renderHome();
    }
  }
);

document.querySelector("#saveStrength").addEventListener(
  "click",
  saveStrength
);

document.querySelector("#prevWeek").addEventListener(
  "click",
  () => {
    selectedWeek = Math.max(1,selectedWeek - 1);
    renderRunning();
  }
);

document.querySelector("#nextWeek").addEventListener(
  "click",
  () => {
    selectedWeek = Math.min(18,selectedWeek + 1);
    renderRunning();
  }
);

document.querySelector("#saveStart").addEventListener(
  "click",
  () => {
    const value =
      document.querySelector("#planStart").value;

    if(!value) {
      return;
    }

    DATA.runPlanStart = mondayOf(value);

    save();

    selectedWeek = currentWeek();

    toast("Inicio del plan actualizado");
    renderRunning();
  }
);

document.querySelector("#reset").addEventListener(
  "click",
  () => {
    const confirmed = confirm(
      "¿Borrar todos los datos de pesas y running?"
    );

    if(!confirmed) {
      return;
    }

    storageRemove();
    location.reload();
  }
);

renderHome();
</script>

</body>
</html>

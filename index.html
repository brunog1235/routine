<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine</title>
<style>
  :root{
    --bg:#faf9f6; --card:#ffffff; --border:#e8e6df;
    --text:#1e1e23; --text-2:#6b6a66; --text-3:#98968e;
    --accent:#3a36b0; --accent-2:#5a56c8; --accent-light:#eeedfe;
    --success:#0f6e56; --success-bg:#e1f5ee;
    --danger:#993c1d; --gray:#888780;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:90px;
    max-width:480px; margin:0 auto; min-height:100vh; position:relative;
  }
  header{
    padding:20px 20px 12px; position:sticky; top:0; background:var(--bg); z-index:10;
  }
  header h1{font-size:20px; font-weight:700;}
  .quote{
    font-style:italic; font-size:14px; color:var(--text-2); margin:6px 0 0; line-height:1.5;
  }
  main{padding:0 20px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
  .stat-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat-card .label{font-size:12px; color:var(--text-2); margin-bottom:4px;}
  .stat-card .value{font-size:22px; font-weight:700;}
  .section-title{font-size:13px; color:var(--text-2); margin:20px 0 8px; font-weight:600; text-transform:uppercase; letter-spacing:0.02em;}
  .chart-wrap{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; height:170px; position:relative;
  }
  .ex-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:8px;
  }
  .ex-row .name{font-size:14px; font-weight:600;}
  .ex-row .delta{font-size:12px; color:var(--success); margin-top:2px;}
  .ex-row .spark{width:70px; height:30px;}
  .pr{
    display:flex; align-items:center; gap:8px; background:var(--success-bg);
    border-radius:var(--radius); padding:10px 14px; margin-bottom:6px; font-size:13px;
  }
  .pr-icon{color:var(--success); font-weight:700;}
  .empty-hint{
    font-size:13px; color:var(--text-3); text-align:center; padding:20px 10px;
  }
  .cta{
    display:block; width:100%; padding:15px; font-size:15px; font-weight:700;
    background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
    margin:20px 0 8px; cursor:pointer;
  }
  .cta:active{opacity:0.85;}
  .cta.secondary{background:var(--card); color:var(--accent); border:1px solid var(--accent);}

  /* Session view */
  .session-header{
    display:flex; align-items:center; gap:10px; margin-bottom:4px;
  }
  .back-btn{
    background:none; border:none; font-size:22px; color:var(--text); cursor:pointer; padding:4px 8px 4px 0;
  }
  .session-header h2{font-size:19px; font-weight:700;}
  .ex-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:12px;
  }
  .ex-card .ex-title{font-size:15px; font-weight:700; margin-bottom:2px;}
  .ex-card .ex-target{font-size:12px; color:var(--text-2); margin-bottom:10px;}
  .set-row{
    display:grid; grid-template-columns:28px 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px;
  }
  .set-row .set-num{font-size:13px; color:var(--text-3); font-weight:600;}
  .set-row input{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; background:var(--bg); color:var(--text);
  }
  .set-row input:focus{outline:none; border-color:var(--accent);}
  .set-row .unit{font-size:12px; color:var(--text-3);}
  .last-time{font-size:11px; color:var(--text-3); margin-top:6px;}
  .save-bar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:var(--bg); padding:14px 20px 20px;
    border-top:1px solid var(--border);
  }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.25s; z-index:100;
  }
  .toast.show{opacity:1;}
  .view{display:none;}
  .view.active{display:block;}
  .day-badge{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px;
    border-radius:20px; background:var(--accent-light); color:var(--accent); margin-top:4px;
  }

  /* Bottom nav */
  .bottom-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:var(--card); border-top:1px solid var(--border);
    display:flex; z-index:20;
  }
  .nav-btn{
    flex:1; background:none; border:none; padding:10px 0 8px; display:flex; flex-direction:column;
    align-items:center; gap:2px; color:var(--text-3); font-size:11px; cursor:pointer;
  }
  .nav-btn .nav-icon{font-size:19px; line-height:1;}
  .nav-btn.active{color:var(--accent); font-weight:700;}

  /* Day view */
  .day-nav{display:flex; align-items:center; justify-content:space-between; margin:4px 0 18px;}
  .day-arrow{
    background:var(--card); border:1px solid var(--border); border-radius:50%;
    width:40px; height:40px; font-size:19px; cursor:pointer; color:var(--text); flex-shrink:0;
  }
  .day-arrow:active{background:var(--accent-light);}
  .day-nav-center{text-align:center;}
  .day-date{font-size:16px; font-weight:700;}
  .day-date .today-tag{color:var(--accent);}
  .rest-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:44px 20px; text-align:center; color:var(--text-2);
  }
  .rest-icon{font-size:30px; margin-bottom:10px;}
  .day-workout-title{font-size:16px; font-weight:700; margin-bottom:10px;}
  .day-ex-row{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:8px;
  }
  .day-ex-name{font-size:14px; font-weight:600;}
  .day-ex-sets{font-size:12px; color:var(--text-2); margin-top:2px;}
  .day-ex-sets.logged{color:var(--success); font-weight:600;}

  .session-day-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;
  }
  .day-arrow.small{width:32px; height:32px; font-size:16px;}
  .session-day-info{text-align:center;}
  .session-date-label{font-size:13px; font-weight:600; color:var(--text-2);}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- HOME VIEW -->
<div class="view active" id="view-home">
  <header>
    <h1>Routine</h1>
    <p class="quote" id="quote"></p>
  </header>
  <main>
    <div class="grid2">
      <div class="stat-card">
        <div class="label">🔥 Racha</div>
        <div class="value" id="streak-val">0 días</div>
      </div>
      <div class="stat-card">
        <div class="label">📅 Hoy toca</div>
        <div class="value" id="today-val">—</div>
      </div>
    </div>

    <div class="section-title">Volumen semanal (kg totales)</div>
    <div class="chart-wrap"><canvas id="volChart"></canvas></div>

    <div class="section-title">Progreso por ejercicio</div>
    <div id="exerciseProgress"></div>

    <div class="section-title">Mejoras recientes</div>
    <div id="prList"></div>

    <button class="cta" id="startBtn">Empezar workout de hoy</button>
    <button class="cta secondary" id="restBtn" style="display:none;">Marcar día de descanso</button>
    <button id="resetDataBtn" style="display:block; width:100%; text-align:center; background:none; border:none; color:var(--text-3); font-size:12px; padding:14px 0 4px; cursor:pointer;">Reiniciar datos</button>
  </main>
</div>

<!-- DAY VIEW -->
<div class="view" id="view-day">
  <header>
    <h1>Días</h1>
  </header>
  <main>
    <div class="day-nav">
      <button class="day-arrow" id="prevDayBtn" aria-label="Día anterior">‹</button>
      <div class="day-nav-center">
        <div class="day-date" id="day-date-label"></div>
        <span class="day-badge" id="day-cycle-badge"></span>
      </div>
      <button class="day-arrow" id="nextDayBtn" aria-label="Día siguiente">›</button>
    </div>
    <div id="day-content"></div>
  </main>
</div>

<!-- SESSION VIEW -->
<div class="view" id="view-session">
  <header>
    <div class="session-header">
      <button class="back-btn" id="backBtn">←</button>
      <h2 id="session-title">Workout A</h2>
    </div>
    <div class="session-day-nav">
      <button class="day-arrow small" id="sessionPrevBtn" aria-label="Día anterior">‹</button>
      <div class="session-day-info">
        <div class="session-date-label" id="session-date-label"></div>
        <span class="day-badge" id="session-day-badge"></span>
      </div>
      <button class="day-arrow small" id="sessionNextBtn" aria-label="Día siguiente">›</button>
    </div>
  </header>
  <main id="session-exercises" style="padding-bottom:80px;"></main>
  <div class="save-bar">
    <button class="cta" id="saveSessionBtn" style="margin:0;">Guardar sesión</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottomNav">
  <button class="nav-btn active" id="navHomeBtn">
    <span class="nav-icon">⌂</span>
    <span>Inicio</span>
  </button>
  <button class="nav-btn" id="navDayBtn">
    <span class="nav-icon">▤</span>
    <span>Días</span>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* ================= DATA ================= */
const WORKOUTS = {
  A: [
    { name: "Bench press / Floor press / Weighted pushups", sets: 3, reps: "8-15" },
    { name: "Pullover", sets: 3, reps: "8-15" },
    { name: "Overhead press", sets: 3, reps: "8-15" },
    { name: "Biceps curl", sets: 3, reps: "12-20" },
    { name: "Skullcrusher / Any overhead extension", sets: 3, reps: "15-20" },
    { name: "Rear delt fly", sets: 3, reps: "15-20" },
    { name: "Lateral raise", sets: 3, reps: "15-20" },
    { name: "Front squat", sets: 3, reps: "8-15" },
    { name: "Romanian deadlift", sets: 3, reps: "8-15" },
    { name: "Calf raise", sets: 3, reps: "15-25" }
  ],
  B: [
    { name: "Overhead press", sets: 3, reps: "8-15" },
    { name: "Dumbbell row", sets: 3, reps: "8-15" },
    { name: "Incline bench press / Decline pushup", sets: 3, reps: "8-15" },
    { name: "Hammer curl", sets: 3, reps: "12-20" },
    { name: "Triceps kickback", sets: 3, reps: "15-20" },
    { name: "Rear delt fly", sets: 3, reps: "15-20" },
    { name: "Lateral raise", sets: 3, reps: "15-20" },
    { name: "Lunges", sets: 3, reps: "12-15" },
    { name: "Front squat", sets: 3, reps: "8-12" },
    { name: "Calf raise", sets: 3, reps: "15-25" }
  ]
};

// horario fijo por día de la semana (0=domingo, 1=lunes, ... 6=sábado)
const WEEKDAY_SCHEDULE = {
  0: "rest",  // domingo
  1: "A",     // lunes
  2: "B",     // martes
  3: "rest",  // miércoles
  4: "A",     // jueves
  5: "B",     // viernes
  6: "rest"   // sábado
};
const WEEKDAY_FULL = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

const QUOTES = [
  "Cada serie de hoy es peso que no vas a tener que levantar mañana.",
  "No hace falta motivación, hace falta la primera serie.",
  "La racha ya es un hábito, no una decisión.",
  "El progreso no se ve en un día, se ve en semanas como esta.",
  "Hoy no tiene que ser perfecto, tiene que ser hecho.",
  "La constancia le gana al talento cuando el talento no entrena.",
  "Un entrenamiento más cerca de la próxima marca personal.",
  "Nadie se arrepintió nunca de haber entrenado.",
  "El cuerpo que querés se construye en días como hoy, sin drama.",
  "Menos excusas, más series."
];

const REST_QUOTES = [
  "Hoy toca descansar. El músculo crece en el descanso, no solo en el gimnasio.",
  "Día de recuperación. Mañana volvés con todo.",
  "Descansar también es parte del plan."
];

const BASE_WEIGHTS = {
  "Bench press / Floor press / Weighted pushups": 40,
  "Pullover": 12,
  "Overhead press": 25,
  "Biceps curl": 10,
  "Skullcrusher / Any overhead extension": 15,
  "Rear delt fly": 6,
  "Lateral raise": 6,
  "Front squat": 40,
  "Romanian deadlift": 40,
  "Calf raise": 30,
  "Dumbbell row": 20,
  "Incline bench press / Decline pushup": 30,
  "Hammer curl": 10,
  "Triceps kickback": 6,
  "Lunges": 12
};

function repsMidFor(rangeStr){
  const [lo, hi] = rangeStr.split("-").map(Number);
  return Math.round((lo + hi) / 2);
}

// Ejercicios que se hacen con una sola mancuerna (el peso cargado ya es el total real).
// Para el resto, el peso que se carga es por mancuerna, no el total.
const SINGLE_IMPLEMENT_EXERCISES = new Set(["Pullover", "Dumbbell row"]);

function isSingleImplement(exerciseName){
  return SINGLE_IMPLEMENT_EXERCISES.has(exerciseName);
}

function weightUnitLabel(exerciseName){
  return isSingleImplement(exerciseName) ? "kg × rep" : "kg c/u × rep";
}

// Carga datos de ejemplo (últimas 2 semanas + hoy) solo si todavía no hay sesiones registradas,
// para que las estadísticas y el Workout A de hoy ya se vean poblados.
function seedDemoData(){
  const occurrence = { A: 0, B: 0 };
  for(let i = 13; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = toLocalDateStr(d);
    const type = workoutForDate(dateStr);
    if(type === "rest") continue;

    const occIdx = occurrence[type];
    occurrence[type]++;
    const bonus = occIdx * 2.5;

    const exercises = WORKOUTS[type].map(ex=>{
      const base = BASE_WEIGHTS[ex.name] || 20;
      const w = base + bonus;
      const mid = repsMidFor(ex.reps);
      return {
        name: ex.name,
        sets: [
          { weight: String(w), reps: String(mid + 1) },
          { weight: String(w), reps: String(mid) },
          { weight: String(w), reps: String(Math.max(mid - 1, 1)) }
        ]
      };
    });

    DATA.sessions.push({ date: dateStr, workoutType: type, exercises });
  }
  saveData(DATA);
}

/* ================= STORAGE ================= */
const STORE_KEY = "workoutTrackerData";

function toLocalDateStr(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function loadData(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){}
  }
  const fresh = { startDate: toLocalDateStr(new Date()), sessions: [] };
  localStorage.setItem(STORE_KEY, JSON.stringify(fresh));
  return fresh;
}
function saveData(data){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

let DATA = loadData();

/* ================= WEEKDAY SCHEDULE / DATE HELPERS ================= */
function daysBetween(d1, d2){
  const a = new Date(d1 + "T00:00:00");
  const b = new Date(d2 + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function todayStr(){
  return toLocalDateStr(new Date());
}
function weekdayOf(dateStr){
  return new Date(dateStr + "T00:00:00").getDay(); // 0-6
}
function workoutForDate(dateStr){
  return WEEKDAY_SCHEDULE[weekdayOf(dateStr)];
}

/* ================= STREAK ================= */
function computeStreak(){
  // count consecutive days (going backward from today) where the scheduled
  // workout day either has a logged session, or was a rest day (auto-pass)
  let streak = 0;
  let cursor = new Date();
  while(true){
    const dStr = toLocalDateStr(cursor);
    const w = workoutForDate(dStr);
    if(w === "rest"){
      streak++;
    } else {
      const done = DATA.sessions.some(s => s.date === dStr && s.workoutType === w);
      if(done){ streak++; }
      else if(dStr === todayStr()){ /* today not logged yet, don't break streak */ }
      else break;
    }
    cursor.setDate(cursor.getDate()-1);
    if(streak > 400) break;
  }
  return streak;
}

/* ================= HOME RENDER ================= */
function renderHome(){
  const today = todayStr();
  const todaysWorkout = workoutForDate(today);

  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
  const isRestDay = todaysWorkout === "rest";
  document.getElementById("quote").textContent = isRestDay
    ? REST_QUOTES[dayOfYear % REST_QUOTES.length]
    : QUOTES[dayOfYear % QUOTES.length];

  document.getElementById("streak-val").textContent = computeStreak() + " días";
  document.getElementById("today-val").textContent = isRestDay ? "Descanso" : ("Workout " + todaysWorkout);

  document.getElementById("startBtn").style.display = isRestDay ? "none" : "block";
  document.getElementById("restBtn").style.display = isRestDay ? "block" : "none";

  renderVolumeChart();
  renderExerciseProgress();
  renderPRs();
}

function renderVolumeChart(){
  // last 6 weeks total volume (sum of weight*reps across all sets, doubled for
  // two-dumbbell exercises so it reflects the real total load moved)
  const weeks = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const end = new Date(now); end.setDate(now.getDate() - i*7);
    const start = new Date(end); start.setDate(end.getDate()-6);
    let vol = 0;
    DATA.sessions.forEach(s=>{
      const sd = new Date(s.date+"T00:00:00");
      if(sd >= start && sd <= end){
        s.exercises.forEach(ex=>{
          const multiplier = isSingleImplement(ex.name) ? 1 : 2;
          ex.sets.forEach(set=>{
            const w = parseFloat(set.weight)||0;
            const r = parseFloat(set.reps)||0;
            vol += w*r*multiplier;
          });
        });
      }
    });
    weeks.push(Math.round(vol));
  }
  const ctx = document.getElementById("volChart");
  if(window._volChart) window._volChart.destroy();
  window._volChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["S-5","S-4","S-3","S-2","S-1","Esta"],
      datasets: [{ data: weeks, backgroundColor: "#7f77dd", borderRadius: 4, maxBarThickness: 26 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{ grid:{display:false}, ticks:{color:"#98968e", font:{size:11}} },
        y:{ grid:{color:"#eeeeee"}, ticks:{color:"#98968e", font:{size:10}} }
      },
      plugins:{ legend:{display:false} }
    }
  });
}

function allExerciseNames(){
  const set = new Set();
  Object.values(WORKOUTS).forEach(list => list.forEach(e => set.add(e.name)));
  return Array.from(set);
}

function maxWeightHistory(exerciseName){
  // returns array of {date, maxWeight} sorted by date asc, from sessions containing this exercise.
  // Uses total load (doubled for two-dumbbell exercises) to match the volume chart and day summary.
  const points = [];
  const multiplier = isSingleImplement(exerciseName) ? 1 : 2;
  DATA.sessions.slice().sort((a,b)=> a.date.localeCompare(b.date)).forEach(s=>{
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex){
      const weights = ex.sets.map(st=>(parseFloat(st.weight)||0)*multiplier).filter(w=>w>0);
      if(weights.length){
        points.push({date:s.date, max: Math.max(...weights)});
      }
    }
  });
  return points;
}

function renderExerciseProgress(){
  const container = document.getElementById("exerciseProgress");
  container.innerHTML = "";
  const names = allExerciseNames();
  // pick exercises that actually have >=2 data points, show up to 4
  const withData = names.map(n=>({name:n, hist:maxWeightHistory(n)})).filter(x=>x.hist.length>=1);

  if(withData.length===0){
    container.innerHTML = '<p class="empty-hint">Todavía no hay datos suficientes. Registrá tu primera sesión para ver el progreso acá.</p>';
    return;
  }

  withData.slice(0,4).forEach((item, i)=>{
    const hist = item.hist;
    const first = hist[0].max;
    const last = hist[hist.length-1].max;
    const delta = last - first;
    const deltaStr = hist.length>1 ? (delta>=0? "+":"") + delta.toFixed(1).replace(/\.0$/,"") + "kg" : "primer registro";

    const row = document.createElement("div");
    row.className = "ex-row";
    row.innerHTML = `
      <div>
        <div class="name">${item.name.split("/")[0].trim()}</div>
        <div class="delta">${deltaStr}</div>
      </div>
      <div class="spark"><canvas id="spark${i}"></canvas></div>
    `;
    container.appendChild(row);
  });

  withData.slice(0,4).forEach((item, i)=>{
    const hist = item.hist;
    const ctx = document.getElementById("spark"+i);
    if(!ctx) return;
    new Chart(ctx, {
      type:"line",
      data:{
        labels: hist.map((_,j)=>j),
        datasets:[{ data: hist.map(h=>h.max), borderColor:"#0f6e56", borderWidth:2, pointRadius:0, tension:0.3, fill:false }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        scales:{ x:{display:false}, y:{display:false} },
        plugins:{ legend:{display:false}, tooltip:{enabled:false} }
      }
    });
  });
}

function renderPRs(){
  const container = document.getElementById("prList");
  container.innerHTML = "";
  const names = allExerciseNames();
  const prs = [];
  names.forEach(name=>{
    const hist = maxWeightHistory(name);
    if(hist.length>=2){
      const last = hist[hist.length-1];
      const prev = hist[hist.length-2];
      if(last.max > prev.max){
        prs.push(`${name.split("/")[0].trim()}: ${prev.max}kg → ${last.max}kg`);
      }
    }
  });
  if(prs.length===0){
    container.innerHTML = '<p class="empty-hint">Todavía no hay mejoras registradas. Van a aparecer acá apenas superes una marca anterior.</p>';
    return;
  }
  prs.slice(0,4).forEach(text=>{
    const div = document.createElement("div");
    div.className = "pr";
    div.innerHTML = `<span class="pr-icon">↑</span><span>${text}</span>`;
    container.appendChild(div);
  });
}

/* ================= DATE FORMATTING ================= */
const DAY_NAMES = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MONTH_NAMES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function formatDateLabel(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
}

/* ================= VIEW SWITCHING ================= */
function showView(name){
  document.getElementById("view-home").classList.toggle("active", name==="home");
  document.getElementById("view-day").classList.toggle("active", name==="day");
  document.getElementById("view-session").classList.toggle("active", name==="session");
  document.getElementById("bottomNav").style.display = (name==="session") ? "none" : "flex";
  document.getElementById("navHomeBtn").classList.toggle("active", name==="home");
  document.getElementById("navDayBtn").classList.toggle("active", name==="day");
}

/* ================= DAY VIEW ================= */
let dayViewDate = null; // set on init / nav click

function getSessionForDate(dateStr, type){
  return DATA.sessions.find(s => s.date===dateStr && s.workoutType===type) || null;
}

function renderDayView(){
  const dateStr = dayViewDate;
  const type = workoutForDate(dateStr);
  const today = todayStr();
  const isToday = dateStr === today;
  const isFuture = dateStr > today;

  document.getElementById("day-date-label").innerHTML =
    formatDateLabel(dateStr) + (isToday ? ' <span class="today-tag">· Hoy</span>' : '');
  document.getElementById("day-cycle-badge").textContent = WEEKDAY_FULL[weekdayOf(dateStr)];

  const content = document.getElementById("day-content");
  content.innerHTML = "";

  if(type === "rest"){
    const card = document.createElement("div");
    card.className = "rest-card";
    card.innerHTML = '<div class="rest-icon">💤</div><p>Día de descanso</p>';
    content.appendChild(card);
    return;
  }

  const session = getSessionForDate(dateStr, type);
  const exercises = WORKOUTS[type];

  const title = document.createElement("div");
  title.className = "day-workout-title";
  title.textContent = "Workout " + type;
  content.appendChild(title);

  exercises.forEach((ex, i)=>{
    const loggedEx = session ? session.exercises.find(e=>e.name===ex.name) : null;
    const row = document.createElement("div");
    row.className = "day-ex-row";
    let summary, loggedClass = "";
    if(loggedEx && loggedEx.sets.some(s=>s.weight||s.reps)){
      const multiplier = isSingleImplement(ex.name) ? 1 : 2;
      summary = loggedEx.sets.map(s=>{
        const raw = parseFloat(s.weight);
        const totalW = isNaN(raw) ? null : raw * multiplier;
        return `${totalW!==null ? totalW : "-"}kg×${s.reps||"-"}`;
      }).join(", ");
      loggedClass = "logged";
    } else if(isFuture){
      const equipNote = isSingleImplement(ex.name) ? "" : " (c/u)";
      summary = `Objetivo: ${ex.sets} sets, ${ex.reps} reps${equipNote}`;
    } else {
      summary = "Sin registrar";
    }
    row.innerHTML = `<div class="day-ex-name">${i+1}. ${ex.name}</div><div class="day-ex-sets ${loggedClass}">${summary}</div>`;
    content.appendChild(row);
  });

  if(!isFuture){
    const btn = document.createElement("button");
    btn.className = "cta";
    btn.style.marginTop = "18px";
    btn.textContent = session ? "Editar este día" : "Registrar este día";
    btn.addEventListener("click", ()=> openSession(type, dateStr, "day"));
    content.appendChild(btn);
  }
}

function shiftDay(delta){
  const d = new Date(dayViewDate + "T00:00:00");
  d.setDate(d.getDate() + delta);
  dayViewDate = toLocalDateStr(d);
  renderDayView();
}

/* ================= SESSION VIEW ================= */
let currentSessionType = null;
let currentSessionDate = null;
let sessionReturnView = "home";

function openSession(type, dateStr, returnTo){
  currentSessionType = type;
  currentSessionDate = dateStr || todayStr();
  sessionReturnView = returnTo || "home";

  showView("session");
  document.getElementById("session-title").textContent = "Workout " + type;
  const isToday = currentSessionDate === todayStr();
  document.getElementById("session-date-label").innerHTML =
    formatDateLabel(currentSessionDate) + (isToday ? ' <span style="color:var(--accent)">· Hoy</span>' : "");
  document.getElementById("session-day-badge").textContent = WEEKDAY_FULL[weekdayOf(currentSessionDate)];
  document.getElementById("sessionNextBtn").style.opacity = isToday ? "0.35" : "1";
  document.getElementById("sessionNextBtn").style.pointerEvents = isToday ? "none" : "auto";

  const container = document.getElementById("session-exercises");
  container.innerHTML = "";

  const existingSession = getSessionForDate(currentSessionDate, type);
  const exercises = WORKOUTS[type];

  exercises.forEach((ex, idxEx)=>{
    const lastSets = getLastLoggedSets(ex.name, currentSessionDate);
    const existingEx = existingSession ? existingSession.exercises.find(e=>e.name===ex.name) : null;
    const unitLabel = weightUnitLabel(ex.name);
    const card = document.createElement("div");
    card.className = "ex-card";
    let setsHtml = "";
    for(let s=0; s<ex.sets; s++){
      const prevW = lastSets[s] ? lastSets[s].weight : "";
      const prevR = lastSets[s] ? lastSets[s].reps : "";
      const curW = existingEx && existingEx.sets[s] ? existingEx.sets[s].weight : "";
      const curR = existingEx && existingEx.sets[s] ? existingEx.sets[s].reps : "";
      setsHtml += `
        <div class="set-row">
          <span class="set-num">${s+1}</span>
          <input type="number" inputmode="decimal" placeholder="${prevW || 'kg'}" value="${curW}" data-ex="${idxEx}" data-set="${s}" data-field="weight" min="0" step="0.5">
          <input type="number" inputmode="numeric" placeholder="${prevR || 'reps'}" value="${curR}" data-ex="${idxEx}" data-set="${s}" data-field="reps" min="0" step="1">
          <span class="unit">${unitLabel}</span>
        </div>
      `;
    }
    const lastNote = lastSets.length
      ? `Última vez: ${lastSets.map(s=>`${s.weight||"-"}kg×${s.reps||"-"}`).join(", ")}`
      : "Todavía no registrado antes";
    const equipNote = isSingleImplement(ex.name) ? "" : " · peso por mancuerna";
    card.innerHTML = `
      <div class="ex-title">${idxEx+1}. ${ex.name}</div>
      <div class="ex-target">Objetivo: ${ex.sets} sets, ${ex.reps} reps${equipNote}</div>
      ${setsHtml}
      <div class="last-time">${lastNote}</div>
    `;
    container.appendChild(card);
  });
}

function getLastLoggedSets(exerciseName, beforeDate){
  const past = DATA.sessions.filter(s => s.date < beforeDate && s.exercises.some(e=>e.name===exerciseName));
  if(past.length===0) return [];
  past.sort((a,b)=> b.date.localeCompare(a.date));
  const ex = past[0].exercises.find(e=>e.name===exerciseName);
  return ex ? ex.sets : [];
}

function shiftSessionDay(delta){
  const today = todayStr();
  let d = new Date(currentSessionDate + "T00:00:00");
  let newDateStr = currentSessionDate;
  let type = "rest";
  for(let i=0; i<30; i++){
    d.setDate(d.getDate() + delta);
    newDateStr = toLocalDateStr(d);
    if(delta > 0 && newDateStr > today) return; // no navegar al futuro
    type = workoutForDate(newDateStr);
    if(type !== "rest") break;
  }
  if(type === "rest") return; // no se encontró día de entrenamiento en el rango
  openSession(type, newDateStr, sessionReturnView);
}

function saveSession(){
  const type = currentSessionType;
  const date = currentSessionDate;
  const exercises = WORKOUTS[type];
  const inputs = document.querySelectorAll("#session-exercises input");
  const structured = exercises.map((ex, idx)=>({ name: ex.name, sets: Array.from({length:ex.sets}, ()=>({weight:"",reps:""})) }));

  inputs.forEach(inp=>{
    const exIdx = parseInt(inp.dataset.ex);
    const setIdx = parseInt(inp.dataset.set);
    const field = inp.dataset.field;
    if(inp.value !== ""){
      structured[exIdx].sets[setIdx][field] = inp.value;
    }
  });

  const hasAnyData = structured.some(ex => ex.sets.some(s => s.weight !== "" || s.reps !== ""));
  if(!hasAnyData){
    showToast("Cargá al menos un set antes de guardar");
    return;
  }

  // remove existing session of same type/date to avoid duplicates
  DATA.sessions = DATA.sessions.filter(s => !(s.date===date && s.workoutType===type));
  DATA.sessions.push({ date, workoutType: type, exercises: structured });
  saveData(DATA);

  showToast("Sesión guardada");
  setTimeout(()=>{
    returnFromSession();
  }, 700);
}

function returnFromSession(){
  if(sessionReturnView === "day"){
    showView("day");
    renderDayView();
  } else {
    showView("home");
    renderHome();
  }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1800);
}

/* ================= EVENTS ================= */
document.getElementById("startBtn").addEventListener("click", ()=>{
  const type = workoutForDate(todayStr());
  if(type !== "rest") openSession(type, todayStr(), "home");
});
document.getElementById("restBtn").addEventListener("click", ()=>{
  showToast("Hoy es día de descanso 💤");
});
document.getElementById("resetDataBtn").addEventListener("click", ()=>{
  const ok = confirm("¿Borrar todos los datos guardados? Esta acción no se puede deshacer.");
  if(ok){
    localStorage.removeItem(STORE_KEY);
    location.reload();
  }
});
document.getElementById("backBtn").addEventListener("click", returnFromSession);
document.getElementById("saveSessionBtn").addEventListener("click", saveSession);
document.getElementById("sessionPrevBtn").addEventListener("click", ()=> shiftSessionDay(-1));
document.getElementById("sessionNextBtn").addEventListener("click", ()=> shiftSessionDay(1));

document.getElementById("navHomeBtn").addEventListener("click", ()=>{
  showView("home");
  renderHome();
});
document.getElementById("navDayBtn").addEventListener("click", ()=>{
  dayViewDate = todayStr();
  showView("day");
  renderDayView();
});
document.getElementById("prevDayBtn").addEventListener("click", ()=> shiftDay(-1));
document.getElementById("nextDayBtn").addEventListener("click", ()=> shiftDay(1));

/* ================= INIT ================= */
dayViewDate = todayStr();
renderHome();
</script>
</body>
</html>

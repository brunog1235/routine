<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routine - Pesas y Running</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--border:#e8e6df;--text:#1e1e23;--t2:#6b6a66;--t3:#98968e;--accent:#3a36b0;--light:#eeedfe;--ok:#0f6e56;--okbg:#e1f5ee;--run:#c45119;--runbg:#fff0e8;--radius:14px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:auto;min-height:100vh;padding-bottom:88px}header{padding:20px 20px 12px;position:sticky;top:0;background:var(--bg);z-index:10}h1{font-size:20px}.quote{font-style:italic;font-size:14px;color:var(--t2);margin-top:6px;line-height:1.45}main{padding:0 20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.card,.stat,.exercise,.run-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}.stat{padding:14px 16px}.label{font-size:12px;color:var(--t2);margin-bottom:4px}.value{font-size:21px;font-weight:750}.section-title{font-size:13px;color:var(--t2);margin:20px 0 8px;font-weight:700;text-transform:uppercase}.chart{height:170px;padding:14px}.bars{height:100%;display:flex;align-items:flex-end;gap:9px;padding-top:8px}.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:100%;max-width:30px;background:#7f77dd;border-radius:5px 5px 2px 2px;min-height:3px}.barval{font-size:9px;color:var(--t2)}.barlabel{font-size:10px;color:var(--t3)}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;margin-bottom:8px}.name{font-size:14px;font-weight:700}.sub{font-size:12px;color:var(--t2);margin-top:3px}.ok{color:var(--ok)}button,input,textarea,select{font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:var(--radius);font-weight:750;background:var(--accent);color:white;margin:16px 0 0;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.btn.secondary{background:white;color:var(--accent);border:1px solid var(--accent)}.btn.run{background:var(--run)}.btn.small{width:auto;padding:8px 12px;margin:0;font-size:12px}.muted-btn{display:block;width:100%;border:0;background:none;color:var(--t3);padding:14px;cursor:pointer}.empty{text-align:center;color:var(--t3);font-size:13px;padding:22px 8px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fff;border-top:1px solid var(--border);display:flex;z-index:30}.nav{flex:1;border:0;background:none;padding:9px 0 7px;color:var(--t3);font-size:10px;cursor:pointer}.nav span{display:block;font-size:19px}.nav.active{color:var(--accent);font-weight:750}.view{display:none}.view.active{display:block}.day-nav{display:flex;align-items:center;justify-content:space-between;margin:5px 0 17px}.arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:white;font-size:20px}.center{text-align:center}.badge{display:inline-block;background:var(--light);color:var(--accent);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:750;margin-top:4px}.run-badge{background:var(--runbg);color:var(--run)}.rest{padding:40px 20px;text-align:center;color:var(--t2)}.exercise{padding:14px 16px;margin-bottom:12px}.ex-head{display:flex;justify-content:space-between;gap:8px}.target{font-size:12px;color:var(--t2);margin:3px 0 10px}.set{display:grid;grid-template-columns:25px 1fr 1fr;gap:8px;margin-bottom:8px;align-items:center}.set input,.field{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}.skip{font-size:11px;color:var(--t2)}.exercise.skipped{opacity:.5}.savebar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;padding:12px 20px 18px;background:var(--bg);border-top:1px solid var(--border);z-index:40}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1e1e23;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;z-index:80;transition:.2s;pointer-events:none}.toast.show{opacity:1}.run-hero{background:linear-gradient(135deg,#b94716,#e47a31);color:#fff;padding:18px;border-radius:18px;margin:4px 0 14px}.run-hero .label{color:#ffe4d3}.run-card{padding:14px;margin-bottom:10px;border-left:4px solid var(--run)}.run-top{display:flex;justify-content:space-between;gap:12px}.run-title{font-weight:750;font-size:15px}.run-detail{font-size:13px;color:var(--t2);line-height:1.45;margin-top:6px}.done{background:var(--okbg);color:var(--ok);font-size:11px;font-weight:750;padding:4px 8px;border-radius:20px;white-space:nowrap}.week-nav{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin:12px 0}.week-nav button{height:38px;border-radius:10px;border:1px solid var(--border);background:white}.week-title{text-align:center;font-weight:750}.date-config{display:grid;grid-template-columns:1fr auto;gap:8px}.date-config .btn{margin:0}.run-form{padding:14px;margin-top:10px;background:var(--runbg);border-radius:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form-grid label,.full-label{font-size:11px;color:var(--t2)}textarea.field{min-height:72px;resize:vertical}.back{border:0;background:none;font-size:22px;padding-right:10px}.session-head{display:flex;align-items:center}.note{font-size:12px;color:var(--t2);line-height:1.45}.hidden{display:none!important}
.account-card{padding:16px;margin-bottom:12px}.account-card h2{font-size:16px;margin-bottom:10px}.account-field{display:block;font-size:12px;color:var(--t2);margin-bottom:10px}.account-field input{margin-top:5px}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.account-actions .btn{margin-top:4px}.sync-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.sync-status{font-size:12px;color:var(--t2)}.sync-status.ok{color:var(--ok)}.sync-status.error{color:#993c1d}.account-email{font-weight:700;margin-top:3px;overflow-wrap:anywhere}.setup-note{font-size:12px;color:var(--t2);line-height:1.5;margin:8px 0}.file-label{display:block;text-align:center;width:100%;padding:13px;border:1px solid var(--accent);border-radius:var(--radius);color:var(--accent);font-weight:700;cursor:pointer;margin-top:8px}.cloud-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--t3);margin-right:5px}.cloud-dot.online{background:var(--ok)}.cloud-dot.error{background:#993c1d}
</style>
</head><body>
<div id="toast" class="toast"></div>
<section id="home" class="view active"><header><h1>Routine</h1><p id="quote" class="quote"></p></header><main><div class="grid2"><div class="stat"><div class="label">🔥 Racha</div><div id="streak" class="value">0 días</div></div><div class="stat"><div class="label">📅 Hoy toca</div><div id="today" class="value">—</div></div></div><div class="section-title">Volumen semanal de pesas</div><div id="volumeChart" class="card chart"></div><div class="section-title">Progreso por ejercicio</div><div id="progress"></div><div class="section-title">Mejoras recientes</div><div id="prs"></div><div id="todayActions"></div><button id="reset" class="muted-btn">Reiniciar todos los datos</button></main></section>
<section id="days" class="view"><header><h1>Días</h1></header><main><div class="day-nav"><button id="prevDay" class="arrow">‹</button><div class="center"><div id="dayLabel" class="name"></div><span id="dayBadge" class="badge"></span></div><button id="nextDay" class="arrow">›</button></div><div id="dayContent"></div></main></section>
<section id="running" class="view"><header><h1>Running</h1><p class="quote">Media maratón · 18 semanas</p></header><main><div class="run-hero"><div class="label">Semana actual</div><div id="runWeekHero" class="value">Semana 1</div><div id="runHeroStats" class="sub" style="color:#fff1e8"></div></div><div class="date-config"><input id="planStart" class="field" type="date"><button id="saveStart" class="btn small run">Fijar inicio</button></div><p class="note" style="margin-top:7px">Elegí el lunes de la semana 1. El calendario se ajusta automáticamente.</p><div class="week-nav"><button id="prevWeek">‹</button><div id="weekTitle" class="week-title"></div><button id="nextWeek">›</button></div><div id="runSessions"></div></main></section>
<section id="account" class="view"><header><h1>Cuenta</h1><p class="quote">Respaldo y sincronización</p></header><main><div id="accountContent"></div></main></section>
<section id="session" class="view"><header><div class="session-head"><button id="back" class="back">←</button><div><h1 id="sessionTitle"></h1><div id="sessionDate" class="sub"></div></div></div></header><main id="exerciseList" style="padding-bottom:90px"></main><div class="savebar"><button id="saveStrength" class="btn" style="margin:0">Guardar sesión</button></div></section>
<nav id="bottom" class="bottom"><button class="nav active" data-view="home"><span>⌂</span>Inicio</button><button class="nav" data-view="days"><span>▤</span>Días</button><button class="nav" data-view="running"><span>◉</span>Running</button><button class="nav" data-view="account"><span>♙</span>Cuenta</button></nav>
<script>
const WORKOUTS={
 UA:[{name:"Bench press / Floor press / Weighted pushups",sets:3,reps:"8-15"},{name:"Dumbbell row",sets:3,reps:"8-15"},{name:"Incline bench press / Decline pushups",sets:3,reps:"8-15"},{name:"Pull-ups",sets:3,reps:"6-15"},{name:"Low-to-high dumbbell flys",sets:2,reps:"10-15"},{name:"Biceps curl",sets:2,reps:"12-20"},{name:"Overhead triceps extension",sets:2,reps:"12-20"},{name:"Face pulls / Reverse flys",sets:2,reps:"15-20"}],
 LA:[{name:"Front squat",sets:3,reps:"8-15"},{name:"Romanian deadlift",sets:3,reps:"8-15"},{name:"Lunges",sets:2,reps:"10-15 por pierna"},{name:"Hip thrust / Glute bridge",sets:2,reps:"12-20"},{name:"Calf raises",sets:3,reps:"15-25"}],
 UB:[{name:"Overhead press",sets:3,reps:"8-15"},{name:"Pull-ups / Dumbbell row",sets:3,reps:"8-15"},{name:"Incline bench press / Decline pushups",sets:3,reps:"8-15"},{name:"Lateral raises",sets:3,reps:"15-20"},{name:"Face pulls / Reverse flys",sets:2,reps:"15-20"},{name:"Hammer curl",sets:3,reps:"12-20"},{name:"Skullcrushers / Close-grip pushups",sets:3,reps:"12-20"},{name:"Dips",sets:2,reps:"12-20 (opcional)"}],
 LB:[{name:"Front squat",sets:3,reps:"8-15"},{name:"Romanian deadlift",sets:3,reps:"8-15"},{name:"Step-ups / Lunges",sets:3,reps:"10-15 por pierna"},{name:"Hip thrust / Glute bridge",sets:3,reps:"12-20"},{name:"Calf raises",sets:3,reps:"15-25"}],
 A:[{name:"Bench press / Floor press / Weighted pushups",sets:3,reps:"8-15"},{name:"Pullover",sets:3,reps:"8-15"},{name:"Overhead press",sets:3,reps:"8-15"},{name:"Biceps curl",sets:3,reps:"12-20"},{name:"Skullcrusher / Any overhead extension",sets:3,reps:"15-20"},{name:"Rear delt fly",sets:3,reps:"15-20"},{name:"Lateral raise",sets:3,reps:"15-20"},{name:"Front squat",sets:3,reps:"8-15"},{name:"Romanian deadlift",sets:3,reps:"8-15"},{name:"Calf raise",sets:3,reps:"15-25"}],
 B:[{name:"Overhead press",sets:3,reps:"8-15"},{name:"Dumbbell row",sets:3,reps:"8-15"},{name:"Incline bench press / Decline pushup",sets:3,reps:"8-15"},{name:"Hammer curl",sets:3,reps:"12-20"},{name:"Triceps kickback",sets:3,reps:"15-20"},{name:"Rear delt fly",sets:3,reps:"15-20"},{name:"Lateral raise",sets:3,reps:"15-20"}],
 B2:[{name:"Overhead press",sets:3,reps:"8-15"},{name:"Dumbbell row",sets:3,reps:"8-15"},{name:"Incline bench press / Decline pushup",sets:3,reps:"8-15"},{name:"Hammer curl",sets:3,reps:"12-20"},{name:"Triceps kickback",sets:3,reps:"15-20"},{name:"Rear delt fly",sets:3,reps:"15-20"},{name:"Lateral raise",sets:3,reps:"15-20"},{name:"Lunges",sets:2,reps:"8-12 por pierna"},{name:"Front squat",sets:2,reps:"8-12"},{name:"Calf raise",sets:3,reps:"15-25"}]
};
const STRENGTH={1:"UA",2:"LA",4:"UB",5:"LB"};
const DISPLAY={UA:"Torso A",LA:"Piernas A",UB:"Torso B",LB:"Piernas B",A:"A",B:"B torso",B2:"B completo"};
const RUN_PLAN=[
 ["Fácil 4 km","Fondo 6 km","Fácil 4 km"],["Fácil 5 km","Fondo 7 km","Fácil 4 km"],["Fácil 5 km + 4 progresiones","Fondo 8 km","Fácil 4 km"],["Fácil 5 km","Fondo 9 km","Fácil 5 km"],
 ["1,5 km cal. + 3 km RMM + 1,5 km enf.","Fondo 10 km","Fácil 5 km"],["1,5 km cal. + 6×400 m rápido, 200 m trote + 1,5 km enf.","Fondo 11 km","Fácil 5 km"],["1,5 km cal. + 6×600 m rápido, 200 m trote + 1,5 km enf.","Fondo 12 km","Fácil 6 km"],["Fácil 6 km + 4 progresiones","Fondo 10 km · descarga","Fácil 5 km"],
 ["1,5 km cal. + 4×1 km rápido, 400 m trote + 1,5 km enf.","Fondo 13 km","Fácil 6 km"],["1,5 km cal. + 6 km RMM + 1,5 km enf.","Fondo 14 km","Fácil 6 km"],["1,5 km cal. + 3×2 km RMM, 500 m trote + 1,5 km enf.","Fondo 15 km","Fácil 7 km"],["Fácil 6 km","Fondo 12 km · descarga","Fácil 5 km"],
 ["1,5 km cal. + 3×2 km RMM-5 s/km, 500 m trote + 1,5 km enf.","Fondo 16 km","Fácil 7 km"],["1,5 km cal. + 8 km RMM + 1,5 km enf.","Fondo 17 km","Fácil 7 km"],["1,5 km cal. + 2×3 km RMM-5 s/km, 800 m trote + 1,5 km enf.","Fondo 18 km","Fácil 6 km"],["1,5 km cal. + 8 km RMM + 1,5 km enf.","Fondo 19 km","Fácil 5 km"],
 ["1,5 km cal. + 5 km RMM + 1,5 km enf.","Fondo 14 km · descarga","Fácil 4 km"],["Fácil 5 km + 4 progresiones","Activación 3 km muy fácil","CARRERA 21,1 km"]
];
const STORE="workoutTrackerData",CONFIG_STORE="routineCloudConfig",AUTH_STORE="routineCloudAuth",SINGLE=new Set(["Pullover","Dumbbell row"]),DAYS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const QUOTES=["No hace falta motivación, hace falta empezar.","Hoy no tiene que ser perfecto, tiene que ser hecho.","La constancia le gana al talento cuando el talento no entrena.","Cada sesión suma, aunque no todas se sientan increíbles."];
function localDate(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateObj(s){return new Date(s+"T00:00:00")}
function shift(s,n){const d=dateObj(s);d.setDate(d.getDate()+n);return localDate(d)}
function mondayOf(s){const d=dateObj(s),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return localDate(d)}
function fmt(s){const d=dateObj(s);return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]}
let memoryStore=null;function storageGet(){try{return localStorage.getItem(STORE)}catch(e){return memoryStore}}function storageSet(v){try{localStorage.setItem(STORE,v)}catch(e){memoryStore=v}}function storageRemove(){try{localStorage.removeItem(STORE)}catch(e){memoryStore=null}}
function load(){let d;try{d=JSON.parse(storageGet())}catch(e){}d=d||{startDate:localDate(),sessions:[]};d.sessions=Array.isArray(d.sessions)?d.sessions:[];d.runSessions=Array.isArray(d.runSessions)?d.runSessions:[];d.runPlanStart=d.runPlanStart||mondayOf(localDate());d.updatedAt=d.updatedAt||new Date(0).toISOString();return d}
let DATA=load(),syncTimer=null;function save(markUpdated=true){if(markUpdated)DATA.updatedAt=new Date().toISOString();storageSet(JSON.stringify(DATA));if(markUpdated)scheduleCloudSync()}function toast(m){const t=document.querySelector("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
function runDefsForWeek(week){if(week===18)return[{offset:0,kind:"easy",title:"Fácil",detail:"Fácil 4 km"},{offset:2,kind:"quality",title:"Activación",detail:RUN_PLAN[17][0]},{offset:6,kind:"long",title:"Carrera",detail:RUN_PLAN[17][2]}];return[{offset:0,kind:"easy",title:"Fácil",detail:RUN_PLAN[week-1][2]},{offset:2,kind:"quality",title:"Calidad",detail:RUN_PLAN[week-1][0]},{offset:6,kind:"long",title:"Fondo",detail:RUN_PLAN[week-1][1]}]}
function planInfo(date){const diff=Math.floor((dateObj(date)-dateObj(DATA.runPlanStart))/86400000),week=Math.floor(diff/7)+1,dayOffset=((dateObj(date).getDay()+6)%7);if(week<1||week>18)return null;const def=runDefsForWeek(week).find(x=>x.offset===dayOffset);return def?{week,kind:def.kind,title:def.title,detail:def.detail,date}:null}
function activities(date){const list=[],day=dateObj(date).getDay(),strength=STRENGTH[day],run=planInfo(date);if(strength)list.push({type:"strength",key:strength});if(run)list.push({type:"run",...run});return list.length?list:[{type:"rest"}]}
function strengthSession(date,type){return DATA.sessions.find(s=>s.date===date&&s.workoutType===type)}function runSession(date){return DATA.runSessions.find(s=>s.date===date)}
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));document.querySelector("#bottom").style.display=id==="session"?"none":"flex";document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===id))}
function streak(){let n=0,d=new Date();for(let i=0;i<400;i++){const s=localDate(d),list=activities(s);let ok=list.every(a=>a.type==="rest"||(a.type==="strength"&&strengthSession(s,a.key))||(a.type==="run"&&runSession(s)));if(s===localDate()&&!ok){d.setDate(d.getDate()-1);continue}if(!ok)break;n++;d.setDate(d.getDate()-1)}return n}
function activityLabel(a){return a.type==="strength"?DISPLAY[a.key]:a.type==="run"?(a.kind==="long"?a.title:a.kind==="easy"?"Easy "+a.detail.replace(/^Fácil /,""):a.title):"Descanso"}
function renderHome(){const now=localDate(),list=activities(now),actions=document.querySelector("#todayActions");document.querySelector("#quote").textContent=QUOTES[new Date().getDate()%QUOTES.length];document.querySelector("#streak").textContent=streak()+" días";document.querySelector("#today").textContent=list.map(activityLabel).join(" + ");actions.innerHTML="";list.forEach(a=>{const b=document.createElement("button");b.className="btn"+(a.type==="run"?" run":"");if(a.type==="rest"){b.textContent="Hoy: descanso";b.disabled=true}else if(a.type==="strength"){const done=!!strengthSession(now,a.key);b.textContent=(done?"Editar ":"Empezar ")+DISPLAY[a.key];b.onclick=()=>openStrength(a.key,now,"home")}else{const done=!!runSession(now);b.textContent=(done?"Editar ":"Registrar ")+activityLabel(a);b.onclick=()=>openRunForm(now)}actions.appendChild(b)});renderVolume();renderProgress();renderPRs()}
function renderVolume(){const vals=[];for(let i=5;i>=0;i--){const end=shift(localDate(),-i*7),start=shift(end,-6);let v=0;DATA.sessions.forEach(s=>{if(s.date>=start&&s.date<=end)(s.exercises||[]).forEach(ex=>{if(ex.skipped)return;const m=SINGLE.has(ex.name)?1:2;(ex.sets||[]).forEach(x=>v+=(+x.weight||0)*(+x.reps||0)*m)})});vals.push(Math.round(v))}const max=Math.max(1,...vals),labels=["S-5","S-4","S-3","S-2","S-1","Esta"];document.querySelector("#volumeChart").innerHTML=`<div class="bars">${vals.map((v,i)=>`<div class="barcol"><div class="barval">${v?Math.round(v/100)/10+"k":"0"}</div><div class="bar" style="height:${Math.max(3,v/max*105)}px"></div><div class="barlabel">${labels[i]}</div></div>`).join("")}</div>`}
function histories(){const map={};DATA.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>(s.exercises||[]).forEach(ex=>{if(ex.skipped)return;const m=SINGLE.has(ex.name)?1:2,max=Math.max(0,...(ex.sets||[]).map(x=>(+x.weight||0)*m));if(max)(map[ex.name]||(map[ex.name]=[])).push({date:s.date,max})}));return map}
function renderProgress(){const c=document.querySelector("#progress"),h=histories(),items=Object.entries(h).slice(0,5);c.innerHTML=items.length?items.map(([n,a])=>`<div class="card row"><div><div class="name">${n.split("/")[0]}</div><div class="sub ok">${a.length>1?((a.at(-1).max-a[0].max)>=0?"+":"")+(a.at(-1).max-a[0].max)+" kg":"Primer registro"}</div></div><b>${a.at(-1).max} kg</b></div>`).join(""):'<div class="empty">Registrá una sesión para ver tu progreso.</div>'}
function renderPRs(){const c=document.querySelector("#prs"),h=histories(),p=[];Object.entries(h).forEach(([n,a])=>{if(a.length>1&&a.at(-1).max>a.at(-2).max)p.push(`${n.split("/")[0]}: ${a.at(-2).max} → ${a.at(-1).max} kg`)});c.innerHTML=p.length?p.slice(0,4).map(x=>`<div class="card row"><span class="ok">↑ ${x}</span></div>`).join(""):'<div class="empty">Las nuevas marcas van a aparecer acá.</div>'}
function strengthDayHtml(a){const s=strengthSession(dayDate,a.key);return`<div class="name" style="margin:16px 0 10px">${DISPLAY[a.key]}</div>`+WORKOUTS[a.key].map(ex=>{const l=s&&(s.exercises||[]).find(x=>x.name===ex.name);return`<div class="card row"><div><div class="name">${ex.name}</div><div class="sub ${l&&!l.skipped?'ok':''}">${l?(l.skipped?"No hecho":(l.sets||[]).map(x=>`${x.weight||'-'}kg×${x.reps||'-'}`).join(", ")):`Objetivo: ${ex.sets} × ${ex.reps}`}</div></div></div>`}).join("")+`<button class="btn" onclick="openStrength('${a.key}','${dayDate}','days')">${s?"Editar":"Registrar"} ${DISPLAY[a.key]}</button>`}
function runDayHtml(a){const log=runSession(dayDate);return`<div class="run-card"><div class="run-top"><div><div class="run-title">Semana ${a.week} · ${a.title}</div><div class="run-detail">${a.detail}</div></div>${log?'<span class="done">Completado</span>':''}</div>${log?`<div class="sub ok" style="margin-top:8px">${log.km||0} km · ${log.time||"sin tiempo"} · RPE ${log.rpe||"—"}</div>`:""}</div><button class="btn run" onclick="openRunForm('${dayDate}')">${log?"Editar":"Registrar"} corrida</button>`}
let dayDate=localDate();function renderDay(){const list=activities(dayDate),c=document.querySelector("#dayContent");document.querySelector("#dayLabel").textContent=fmt(dayDate)+(dayDate===localDate()?" · Hoy":"");document.querySelector("#dayBadge").textContent=DAYS[dateObj(dayDate).getDay()];if(list[0].type==="rest"){c.innerHTML='<div class="card rest">💤<br><br>Día de descanso</div>';return}c.innerHTML=list.map(a=>a.type==="strength"?strengthDayHtml(a):runDayHtml(a)).join("")}
function shiftDay(n){dayDate=shift(dayDate,n);renderDay()}
let current={};function openStrength(type,date,back){current={type,date,back};show("session");document.querySelector("#sessionTitle").textContent="Workout "+DISPLAY[type];document.querySelector("#sessionDate").textContent=fmt(date);const old=strengthSession(date,type),c=document.querySelector("#exerciseList");c.innerHTML=WORKOUTS[type].map((ex,i)=>{const last=[...DATA.sessions].filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date)).map(s=>(s.exercises||[]).find(x=>x.name===ex.name&&!x.skipped)).find(Boolean),cur=old&&(old.exercises||[]).find(x=>x.name===ex.name),sk=cur&&cur.skipped;return`<div class="exercise ${sk?'skipped':''}" data-i="${i}"><div class="ex-head"><b>${i+1}. ${ex.name}</b><label class="skip"><input type="checkbox" class="skipbox" ${sk?'checked':''}> No hecho</label></div><div class="target">${ex.sets} sets · ${ex.reps} reps${SINGLE.has(ex.name)?"":" · peso por mancuerna"}</div>${Array.from({length:ex.sets},(_,j)=>`<div class="set"><span>${j+1}</span><input type="number" step="0.5" class="w" placeholder="${last?.sets?.[j]?.weight||'kg'}" value="${cur?.sets?.[j]?.weight||''}" ${sk?'disabled':''}><input type="number" class="r" placeholder="${last?.sets?.[j]?.reps||'reps'}" value="${cur?.sets?.[j]?.reps||''}" ${sk?'disabled':''}></div>`).join("")}</div>`}).join("");c.querySelectorAll(".skipbox").forEach(x=>x.onchange=()=>{const card=x.closest(".exercise");card.classList.toggle("skipped",x.checked);card.querySelectorAll("input.w,input.r").forEach(i=>i.disabled=x.checked)})}
function saveStrength(){const ex=WORKOUTS[current.type].map((e,i)=>{const card=document.querySelector(`.exercise[data-i="${i}"]`),sk=card.querySelector(".skipbox").checked;return{name:e.name,skipped:sk,sets:[...card.querySelectorAll(".set")].map(r=>({weight:sk?"":r.querySelector(".w").value,reps:sk?"":r.querySelector(".r").value}))}});if(!ex.some(e=>e.skipped||e.sets.some(s=>s.weight||s.reps)))return toast("Cargá al menos un set");DATA.sessions=DATA.sessions.filter(s=>!(s.date===current.date&&s.workoutType===current.type));DATA.sessions.push({date:current.date,workoutType:current.type,exercises:ex});save();toast("Sesión guardada");setTimeout(()=>{show(current.back);current.back==="days"?renderDay():renderHome()},500)}
let selectedWeek=1;function currentWeek(){return Math.max(1,Math.min(18,Math.floor((dateObj(localDate())-dateObj(DATA.runPlanStart))/604800000)+1))}function weekDate(w,offset){return shift(DATA.runPlanStart,(w-1)*7+offset)}
function runStats(){const done=DATA.runSessions.length,total=DATA.runSessions.reduce((a,s)=>a+(+s.km||0),0),long=Math.max(0,...DATA.runSessions.map(s=>+s.km||0));return{done,total,long}}
function renderRunning(){document.querySelector("#planStart").value=DATA.runPlanStart;const cw=currentWeek(),st=runStats();document.querySelector("#runWeekHero").textContent="Semana "+cw;document.querySelector("#runHeroStats").textContent=`${st.done} sesiones · ${st.total.toFixed(1)} km · fondo máximo ${st.long} km`;document.querySelector("#weekTitle").textContent="Semana "+selectedWeek+" de 18";const defs=runDefsForWeek(selectedWeek);document.querySelector("#runSessions").innerHTML=defs.map(def=>{const date=weekDate(selectedWeek,def.offset),log=runSession(date);return`<div class="run-card"><div class="run-top"><div><div class="run-title">${fmt(date)} · ${def.title}</div><div class="run-detail">${def.detail}</div></div>${log?'<span class="done">Completado</span>':''}</div>${log?`<div class="sub ok" style="margin-top:8px">${log.km||0} km · ${log.time||"sin tiempo"} · RPE ${log.rpe||"—"}</div>`:""}<button class="btn small run" style="margin-top:10px" onclick="openRunForm('${date}')">${log?"Editar":"Registrar"}</button><div id="form-${date}"></div></div>`}).join("")}
function openRunForm(date){show("running");selectedWeek=planInfo(date)?.week||currentWeek();renderRunning();const host=document.querySelector(`#form-${date}`);if(!host)return;const old=runSession(date)||{};host.innerHTML=`<div class="run-form"><div class="form-grid"><label>Distancia real (km)<input id="runKm" class="field" type="number" step="0.01" value="${old.km||''}"></label><label>Tiempo (hh:mm:ss)<input id="runTime" class="field" placeholder="01:10:00" value="${old.time||''}"></label><label>RPE (1-10)<input id="runRpe" class="field" type="number" min="1" max="10" value="${old.rpe||''}"></label><label>Ritmo medio<input id="runPace" class="field" placeholder="7:00/km" value="${old.pace||''}"></label></div><label class="full-label">Notas<textarea id="runNotes" class="field">${old.notes||''}</textarea></label><button class="btn run" onclick="saveRun('${date}')">Guardar corrida</button>${old.date?`<button class="muted-btn" onclick="deleteRun('${date}')">Eliminar registro</button>`:""}</div>`;host.scrollIntoView({behavior:"smooth",block:"center"})}
function saveRun(date){const item={date,km:document.querySelector("#runKm").value,time:document.querySelector("#runTime").value,rpe:document.querySelector("#runRpe").value,pace:document.querySelector("#runPace").value,notes:document.querySelector("#runNotes").value};if(!item.km&&!item.time)return toast("Ingresá distancia o tiempo");DATA.runSessions=DATA.runSessions.filter(s=>s.date!==date);DATA.runSessions.push(item);save();toast("Corrida guardada");renderRunning()}
function deleteRun(date){if(!confirm("¿Eliminar esta corrida?"))return;DATA.runSessions=DATA.runSessions.filter(s=>s.date!==date);save();renderRunning()}
function readLocalJSON(key){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}}
function writeLocalJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}}
function removeLocalKey(key){try{localStorage.removeItem(key)}catch(e){}}
let CLOUD_CONFIG=readLocalJSON(CONFIG_STORE)||{url:"https://vpmaxvdasywdknxpatfb.supabase.co",key:"sb_publishable_ifEdHHR8uuv9EmBRxbg53w_KzUBgk69"},AUTH=readLocalJSON(AUTH_STORE),RECOVERY_MODE=false,syncState={type:"idle",text:"Sin sincronizar"};
function escapeHtml(value){return String(value||"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]))}
function setSyncState(type,text){syncState={type,text};const el=document.querySelector("#syncStatus");if(el){el.className="sync-status "+type;el.innerHTML=`<span class="cloud-dot ${type==="ok"?"online":type==="error"?"error":""}"></span>${escapeHtml(text)}`}}
function configured(){return !!(CLOUD_CONFIG&&CLOUD_CONFIG.url&&CLOUD_CONFIG.key)}
function loggedIn(){return !!(AUTH&&AUTH.access_token&&AUTH.user&&AUTH.user.id)}
function cleanUrl(url){return String(url||"").trim().replace(/\/+$/,"")}
function unsafeKey(key){if(/^sb_secret_/i.test(key))return true;try{const part=key.split(".")[1];if(part){const payload=JSON.parse(atob(part.replace(/-/g,"+").replace(/_/g,"/")));return payload.role==="service_role"}}catch(e){}return false}
async function cloudRequest(path,options={},needsAuth=true){if(!configured())throw new Error("Falta configurar Supabase");if(needsAuth)await ensureFreshAuth();const headers={apikey:CLOUD_CONFIG.key,"Content-Type":"application/json",...(options.headers||{})};if(needsAuth&&AUTH?.access_token)headers.Authorization="Bearer "+AUTH.access_token;const response=await fetch(CLOUD_CONFIG.url+path,{...options,headers});const text=await response.text();let data=null;try{data=text?JSON.parse(text):null}catch(e){data=text}if(!response.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||`Error ${response.status}`);return data}
async function ensureFreshAuth(){if(!loggedIn())throw new Error("Iniciá sesión");const expires=(AUTH.expires_at||0)*1000;if(expires&&Date.now()<expires-60000)return AUTH;const data=await cloudRequest("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:AUTH.refresh_token})},false);setAuth(data);return AUTH}
function setAuth(data){if(!data?.access_token)return;AUTH={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:data.expires_at||Math.floor(Date.now()/1000)+(data.expires_in||3600),user:data.user};writeLocalJSON(AUTH_STORE,AUTH)}
function scheduleCloudSync(){clearTimeout(syncTimer);if(!configured()||!loggedIn())return;setSyncState("pending","Pendiente de sincronizar");syncTimer=setTimeout(()=>syncCloud(false),900)}
function mergeByKey(first,second,keyFn,secondWins){const map=new Map();first.forEach(item=>map.set(keyFn(item),item));second.forEach(item=>{const key=keyFn(item);if(secondWins||!map.has(key))map.set(key,item)});return [...map.values()]}
function mergeData(local,remote){const localNewer=new Date(local.updatedAt||0)>=new Date(remote.updatedAt||0),newer=localNewer?local:remote,older=localNewer?remote:local;return{...older,...newer,sessions:mergeByKey(older.sessions||[],newer.sessions||[],x=>x.date+"|"+x.workoutType,true),runSessions:mergeByKey(older.runSessions||[],newer.runSessions||[],x=>x.date,true),updatedAt:new Date().toISOString(),cloudOwnerId:loggedIn()?AUTH.user.id:(newer.cloudOwnerId||older.cloudOwnerId||null)}}
async function fetchCloudData(){const rows=await cloudRequest(`/rest/v1/user_data?user_id=eq.${encodeURIComponent(AUTH.user.id)}&select=payload,updated_at`,{method:"GET"});return Array.isArray(rows)&&rows[0]?rows[0].payload:null}
async function uploadCloudData(){const payload={...DATA,cloudOwnerId:AUTH.user.id};await cloudRequest("/rest/v1/user_data?on_conflict=user_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:AUTH.user.id,payload,updated_at:new Date().toISOString()})});DATA.cloudOwnerId=AUTH.user.id;storageSet(JSON.stringify(DATA))}
async function syncCloud(showMessage=true){if(!configured()||!loggedIn())return;setSyncState("pending","Sincronizando…");try{const remote=await fetchCloudData();if(remote){DATA=mergeData(DATA,remote);storageSet(JSON.stringify(DATA))}else{DATA.cloudOwnerId=AUTH.user.id}await uploadCloudData();setSyncState("ok","Guardado en la nube");refreshVisible();if(showMessage)toast("Datos sincronizados")}catch(error){setSyncState("error",navigator.onLine?error.message:"Sin conexión · guardado local");if(showMessage)toast("No se pudo sincronizar")}}
function refreshVisible(){if(document.querySelector("#home").classList.contains("active"))renderHome();if(document.querySelector("#days").classList.contains("active"))renderDay();if(document.querySelector("#running").classList.contains("active"))renderRunning();if(document.querySelector("#account").classList.contains("active"))renderAccount()}
function saveCloudConfig(){const url=cleanUrl(document.querySelector("#cloudUrl").value),key=document.querySelector("#cloudKey").value.trim();if(!/^https:\/\//i.test(url)||!key)return toast("Completá la URL HTTPS y la clave pública");if(unsafeKey(key))return toast("No uses la clave secret/service_role");CLOUD_CONFIG={url,key};writeLocalJSON(CONFIG_STORE,CLOUD_CONFIG);toast("Configuración guardada");renderAccount()}
function clearCloudConfig(){if(!confirm("¿Quitar la configuración de la nube de este dispositivo? Tus datos locales no se borran."))return;CLOUD_CONFIG=null;AUTH=null;removeLocalKey(CONFIG_STORE);removeLocalKey(AUTH_STORE);renderAccount()}
async function signUp(){const email=document.querySelector("#authEmail").value.trim(),password=document.querySelector("#authPassword").value;if(!email||password.length<6)return toast("Ingresá un email y una contraseña de al menos 6 caracteres");setSyncState("pending","Creando cuenta…");try{const data=await cloudRequest("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password})},false);if(data.session||data.access_token){setAuth(data.session||data);await syncCloud(false);toast("Cuenta creada")}else toast("Revisá tu email para confirmar la cuenta");renderAccount()}catch(error){setSyncState("error",error.message);toast(error.message)}}
async function signIn(){const email=document.querySelector("#authEmail").value.trim(),password=document.querySelector("#authPassword").value;if(!email||!password)return toast("Ingresá email y contraseña");setSyncState("pending","Iniciando sesión…");try{const data=await cloudRequest("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})},false);setAuth(data);await syncCloud(false);toast("Sesión iniciada");renderAccount()}catch(error){setSyncState("error",error.message);toast(error.message)}}
async function recoverPassword(){const email=document.querySelector("#authEmail").value.trim();if(!email)return toast("Ingresá tu email");try{await cloudRequest("/auth/v1/recover",{method:"POST",body:JSON.stringify({email,redirect_to:location.href.split("#")[0]})},false);toast("Te enviamos un email de recuperación")}catch(error){toast(error.message)}}
async function updatePassword(){const password=document.querySelector("#newPassword")?.value||"";if(password.length<6)return toast("Usá al menos 6 caracteres");try{await cloudRequest("/auth/v1/user",{method:"PUT",body:JSON.stringify({password})});RECOVERY_MODE=false;toast("Contraseña actualizada");renderAccount()}catch(error){toast(error.message)}}
async function handleAuthRedirect(){const params=new URLSearchParams(location.hash.replace(/^#/,"")),token=params.get("access_token");if(!token||!configured())return false;try{AUTH={access_token:token,refresh_token:params.get("refresh_token")||"",expires_at:Math.floor(Date.now()/1000)+(+params.get("expires_in")||3600),user:AUTH?.user||{id:"pending",email:""}};writeLocalJSON(AUTH_STORE,AUTH);const user=await cloudRequest("/auth/v1/user",{method:"GET"});AUTH.user=user;writeLocalJSON(AUTH_STORE,AUTH);RECOVERY_MODE=params.get("type")==="recovery";history.replaceState(null,"",location.pathname+location.search);show("account");renderAccount();return true}catch(error){setSyncState("error",error.message);return false}}
async function signOut(){try{if(loggedIn())await cloudRequest("/auth/v1/logout",{method:"POST"})}catch(e){}AUTH=null;removeLocalKey(AUTH_STORE);setSyncState("idle","Sesión cerrada");renderAccount();toast("Sesión cerrada")}
function exportData(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`routine-respaldo-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!Array.isArray(incoming.sessions)||!Array.isArray(incoming.runSessions))throw new Error();DATA=mergeData(DATA,incoming);save();toast("Respaldo importado");refreshVisible()}catch(e){toast("El archivo no es un respaldo válido")}};reader.readAsText(file)}
function renderAccount(){const c=document.querySelector("#accountContent");if(!configured()){c.innerHTML=`<div class="card account-card"><h2>Configurar respaldo en la nube</h2><p class="setup-note">Creá un proyecto en Supabase, ejecutá el archivo SQL incluido y pegá solamente la URL del proyecto y su clave pública publishable/anon.</p><label class="account-field">URL de Supabase<input id="cloudUrl" class="field" placeholder="https://tu-proyecto.supabase.co"></label><label class="account-field">Clave pública<input id="cloudKey" class="field" type="password" placeholder="sb_publishable_… o anon key"></label><button class="btn" onclick="saveCloudConfig()">Guardar configuración</button></div>${backupHtml()}`;return}if(!loggedIn()){c.innerHTML=`<div class="card account-card"><h2>Entrar o crear cuenta</h2><label class="account-field">Email<input id="authEmail" class="field" type="email" autocomplete="email"></label><label class="account-field">Contraseña<input id="authPassword" class="field" type="password" minlength="6" autocomplete="current-password"></label><div class="account-actions"><button class="btn" onclick="signIn()">Entrar</button><button class="btn secondary" onclick="signUp()">Crear cuenta</button></div><button class="muted-btn" onclick="recoverPassword()">Olvidé mi contraseña</button><button class="muted-btn" onclick="clearCloudConfig()">Cambiar configuración</button></div>${backupHtml()}`;return}const recovery=RECOVERY_MODE?`<div class="card account-card"><h2>Elegí una contraseña nueva</h2><label class="account-field">Nueva contraseña<input id="newPassword" class="field" type="password" minlength="6" autocomplete="new-password"></label><button class="btn" onclick="updatePassword()">Actualizar contraseña</button></div>`:"";c.innerHTML=recovery+`<div class="card account-card"><div class="sync-line"><div><div class="label">Sesión iniciada</div><div class="account-email">${escapeHtml(AUTH.user.email||"")}</div></div><div id="syncStatus" class="sync-status ${syncState.type}"></div></div><button class="btn" onclick="syncCloud(true)">Sincronizar ahora</button><button class="muted-btn" onclick="signOut()">Cerrar sesión</button></div>${backupHtml()}`;setSyncState(syncState.type,syncState.text)}
function backupHtml(){return`<div class="card account-card"><h2>Respaldo manual</h2><p class="setup-note">El archivo incluye entrenamientos, corridas y configuración del plan. No incluye tu contraseña ni las claves de Supabase.</p><button class="btn secondary" onclick="exportData()">Exportar JSON</button><label class="file-label">Importar JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label></div>`}
window.addEventListener("online",()=>syncCloud(false));
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{show(n.dataset.view);if(n.dataset.view==="home")renderHome();if(n.dataset.view==="days"){dayDate=localDate();renderDay()}if(n.dataset.view==="running"){selectedWeek=currentWeek();renderRunning()}if(n.dataset.view==="account")renderAccount()});document.querySelector("#prevDay").onclick=()=>shiftDay(-1);document.querySelector("#nextDay").onclick=()=>shiftDay(1);document.querySelector("#back").onclick=()=>{show(current.back);current.back==="days"?renderDay():renderHome()};document.querySelector("#saveStrength").onclick=saveStrength;document.querySelector("#prevWeek").onclick=()=>{selectedWeek=Math.max(1,selectedWeek-1);renderRunning()};document.querySelector("#nextWeek").onclick=()=>{selectedWeek=Math.min(18,selectedWeek+1);renderRunning()};document.querySelector("#saveStart").onclick=()=>{const v=document.querySelector("#planStart").value;if(!v)return;DATA.runPlanStart=mondayOf(v);save();selectedWeek=currentWeek();toast("Inicio del plan actualizado");renderRunning()};document.querySelector("#reset").onclick=()=>{if(confirm("¿Borrar todos los datos locales de pesas y running? Si tenés cuenta, la copia en la nube se conserva.")){storageRemove();location.reload()}};
renderHome();handleAuthRedirect().then(handled=>{if(!handled&&configured()&&loggedIn())syncCloud(false)});
</script></body></html>
